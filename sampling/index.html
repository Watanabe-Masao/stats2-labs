<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽出ラボ</title>
<style>
:root{--bg:#f6f7f7;--surface:#ffffff;--surface-2:#eef1f0;--raised:#ffffff;--ink:#161a1a;--ink-2:#48504f;--ink-3:#68706f;--line:#e0e4e3;--line-strong:#cbd1d0;--accent:#0f7f73;--accent-ink:#ffffff;--accent-soft:rgba(15, 127, 115, .08);--scrim:rgba(0, 0, 0, .28);--flash:rgba(15, 127, 115, .16);--good:#2f7d3f;--bad:#c53b3b;--accent-line:rgba(15, 127, 115, .35);--focus:#b58000;--mark:rgba(255, 196, 0, .45);--data-1:#2a78d6;--data-hi:#b86e00;--data-2:#6250d6;--data-3:#c2416f;--data-1-soft:#9dbfe8;--data-bg:#eaf1fb;--data-hi-bg:#fbf1e3;--figure-bg:#ffffff;--k-pre:#6d7574;--k-der:#2a78d6;--k-gen:#2a78d6;--k-conv:#b86e00;--k-con:#c2416f;--k-int:#2a78d6;--k-app:#8b9392;--font:system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;--font-mono:ui-monospace, Menlo, monospace;--fs-display:20px;--fs-title:19px;--fs-head:15px;--fs-body:14.5px;--fs-small:12.5px;--fs-label:12.5px;--fs-tag:11.5px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:22px;--r-s:4px;--r-m:6px;--r-l:10px;--r-pill:999px;--tap:44px;--dur-press:90ms;--dur:200ms;--dur-flash:700ms;--dur-sheet:320ms;--ease-sheet:cubic-bezier(0.32, 0.72, 0, 1);--ease:cubic-bezier(0.2, 0.8, 0.2, 1);--press-scale:0.97;--dur-spring:480ms;--ease-spring:linear(0, 0.0241, 0.0838, 0.1642, 0.2544, 0.347, 0.437, 0.5213, 0.598, 0.6663, 0.726, 0.7774, 0.8211, 0.8577, 0.8881, 0.913, 0.9332, 0.9495, 0.9624, 0.9725, 0.9804, 0.9864, 0.991, 0.9944, 0.9968, 0.9986, 0.9998, 1.0006, 1.0011, 1.0014, 1.0015, 1.0015, 1);--ease-bounce:linear(0, 0.0273, 0.097, 0.1929, 0.3023, 0.4158, 0.5262, 0.6286, 0.7203, 0.7995, 0.8658, 0.9196, 0.9618, 0.9936, 1.0164, 1.0317, 1.0408, 1.0452, 1.0459, 1.044, 1.0405, 1.0358, 1.0307, 1.0255, 1.0205, 1.0159, 1.0118, 1.0084, 1.0055, 1.0031, 1.0013, 1, 1);--shadow-raised:0 -8px 28px rgba(0, 0, 0, .14);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1111;--surface:#161919;--surface-2:#1c2020;--raised:#222727;--ink:#e6e9e8;--ink-2:#a6adab;--ink-3:#7e8684;--line:#252a2a;--line-strong:#333a39;--accent:#4fbfae;--accent-ink:#06201c;--accent-soft:rgba(79, 191, 174, .12);--scrim:rgba(0, 0, 0, .55);--flash:rgba(79, 191, 174, .20);--good:#7bc98a;--bad:#e66767;--accent-line:rgba(79, 191, 174, .40);--focus:#e0b04a;--mark:rgba(255, 196, 0, .35);--data-1:#3987e5;--data-hi:#c98500;--data-2:#9085e9;--data-3:#d55181;--data-1-soft:#2b4566;--data-bg:#172231;--data-hi-bg:#2e2412;--figure-bg:#ffffff;--k-pre:#7a8280;--k-der:#3987e5;--k-gen:#3987e5;--k-conv:#c98500;--k-con:#d55181;--k-int:#3987e5;--k-app:#a6adab;--shadow-raised:0 -8px 28px rgba(0, 0, 0, .5);color-scheme:dark}}
/* 色と動きの値は design/tokens.json（knowledge-net と共通）から build/labs.py が先頭に差し込む。ここでは、ラボの古い名前をその値に結ぶだけ（色の値を書かない）。
データの色（--acc＝主の系列・--acc2＝注目する値・2つ目の群）は静止図と同じ（静止図の BLUE・ORANGE）。操作の色（選んだタブ・主ボタン・つまみ）は --accent。 */
:root{--bg:var(--surface);--fg:var(--ink);--mut:var(--ink-2);--card:var(--surface-2);--acc:var(--data-1);--acc2:var(--data-hi);--ok:var(--good);--ng:var(--bad);--task:var(--accent-soft);--taskline:var(--accent-line)}
*{box-sizing:border-box}
body{margin:0;padding:12px 14px 20px;font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 10px}
.tabs button{flex:1 1 30%;min-height:40px;padding:6px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs button:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
label{font-size:14px;display:flex;align-items:center;gap:6px}
select{font-size:15px;min-height:40px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.big{font-size:18px;font-weight:700}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
button.act,button.sub{min-height:44px;padding:8px 14px;border-radius:10px;font-size:15px;cursor:pointer}
button.act{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.sub{border:1px solid var(--line);background:var(--card);color:var(--fg)}
button:disabled{opacity:.45}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right;vertical-align:top}
td:first-child,th:first-child{text-align:left}
svg{max-width:100%;height:auto;display:block}
/* −／＋ 付きスライダー */
.lk-step{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.lk-step .lk-name{font-size:14px;min-width:4.5em}
.lk-step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;line-height:1;cursor:pointer;flex:none}
.lk-step input[type=range]{flex:1 1 90px;min-width:90px;height:32px}
.lk-step .lk-val{font-weight:700;min-width:4.2em;text-align:right}
/* 課題カード */
.lk-task{background:var(--task);border:1px solid var(--taskline);border-radius:12px;padding:10px 12px;margin:6px 0 4px}
.lk-task .lk-tt{font-weight:700;margin-bottom:2px}
.lk-task input[type=number]{font-size:17px;width:7.5em;min-height:44px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.lk-choices{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.lk-choices button{min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;cursor:pointer}
.lk-choices button.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.lk-skip{background:none;border:none;color:var(--mut);text-decoration:underline;font-size:13px;cursor:pointer;min-height:44px}
.lk-verdict{margin-top:6px;padding-top:6px;border-top:1px dashed var(--taskline)}
/* 予想する前は結果を隠す */
.lk-locked .res{display:none}
.lk-locked .ctl{pointer-events:none;opacity:.5}
.lk-wait{display:none}
.lk-locked .lk-wait{display:block}
/* 式で計算 */
.lk-formula{border-left:3px solid var(--accent-line);padding:4px 10px;margin:8px 0;font-size:14px}
.lk-formula .lk-ft{font-size:12px;color:var(--mut)}
.lk-formula div.l{font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
/* スマホの操作感：タップで拡大しない・ダブルタップの遅れをなくす・スライダーのつまみを大きく */
button,a,input,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select{font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:40px;margin:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line-strong)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.lk-step{display:grid;grid-template-columns:auto 40px minmax(60px,1fr) 40px auto;gap:6px;align-items:center;flex-wrap:nowrap}
.lk-step .lk-name{min-width:0;font-size:13px;line-height:1.25;max-width:4.5em}
.lk-step button{width:40px;height:40px}
.lk-step input[type=range]{min-width:0;width:100%;height:40px}
.lk-step .lk-val{min-width:3.4em;font-size:14px;font-variant-numeric:tabular-nums}   /* 動かしている数だけ等幅（数が変わっても横にずれない。文中の数は詰めたまま） */
.lk-fixed{font-size:14px}
.lk-why{margin-top:4px;font-size:14px}
.lk-live{margin-top:6px;padding:4px 8px;border-radius:8px;background:var(--bg);font-size:14px}
.lk-bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.lk-link{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-size:14px;text-decoration:none;cursor:pointer}
/* Notion の埋め込み（高さ約320px）：要点と操作だけ */
body.lk-embed{padding:8px 12px 10px}
.lk-embed h1{display:none}
.lk-embed .lk-task{margin-top:0}
.lk-embed .lk-tt,.lk-embed .lk-note{display:none}
.lk-embed .lk-q::before{content:"🎯 "}
.lk-embed.lk-locked .ctl{display:none}
.lk-embed.lk-locked .lk-wait{display:none}
.lk-embed.lk-focus .mode>p.mut{display:none}
.lk-embed.lk-pred:not(.lk-more) .mode .res,.lk-embed.lk-pred:not(.lk-more) .mode .det{display:none}
[hidden]{display:none!important}
.lk-step .lk-name{max-width:5.2em;white-space:nowrap}
.lk-embed .lk-done .lk-q{display:none}
.lk-embed .lk-done .lk-verdict{border-top:0;margin-top:0;padding-top:0}
.lk-embed.lk-pred:not(.lk-more) .mode .res.key{display:block}
body.lk-embed.lk-locked.lk-pred .mode .res.key{display:none}
/* 法則を見つける：条件ごとの予想と結果の記録、最後の式 */
.lk-hist{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 6px}
.lk-hist th,.lk-hist td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
.lk-law{margin-top:8px;padding:8px 10px;border-left:4px solid var(--accent);background:var(--card)}
.lk-law .l{font-size:14px;line-height:1.6;padding-left:.6em;text-indent:-.6em}
.lk-law .l::before{content:"・"}
.lk-limit{margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--task);font-size:13px}
/* 解説付き再生（#90）：上に図、すぐ下に今の説明、その下に前へ／再生／次へ */
.lk-tour{background:var(--task);border:1px solid var(--taskline);border-radius:12px;padding:8px 12px;margin:6px 0}
.lk-tour .lk-tt{font-weight:700;font-size:13px;color:var(--mut)}
.lk-say{font-size:15px;line-height:1.55;margin:2px 0 6px}
.lk-say mark,.lk-tlist mark{background:none;color:inherit;font-weight:700;box-shadow:inset 0 -0.45em 0 var(--mark)}
.lk-tctl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px}
.lk-tctl button{min-height:44px;padding:6px 4px;font-size:15px}
.lk-tsub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lk-tlist{margin:6px 0 0;padding-left:1.4em;font-size:14px}
.lk-tlist button{background:none;border:none;color:var(--fg);text-align:left;padding:6px 0;font:inherit;cursor:pointer;min-height:40px}
.lk-tlist li.on button{color:var(--accent)}
.lk-tfree{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.lk-touring:not(.lk-free) .mode .ctl,.lk-touring:not(.lk-free) .mode>p.mut{display:none}
.lk-hl{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.lk-embed.lk-touring .mode .det{display:none}
.lk-embed.lk-touring:not(.lk-free) .mode .res.key:not([data-tour-anchor]):not([data-tour-show]){display:none}
.lk-embed .lk-tour{padding:6px 10px;margin:4px 0}
.lk-embed .lk-say{font-size:14px;margin:0 0 4px}
.lk-embed .lk-tsub{margin-top:4px}
.lk-embed .lk-tsub .lk-link{min-height:36px;padding:4px 10px;font-size:13px}
.lk-tline{font-size:13px;margin-top:2px}.lk-tline span{display:inline-block;padding:0 3px}
.lk-tno{display:none;font-weight:700;color:var(--mut)}
.lk-embed .lk-tour .lk-tt{display:none}
.lk-embed .lk-tno{display:inline}
.lk-embed .lk-tctl button{min-height:40px}
.lk-embed.lk-touring #lk-tour~*,.lk-embed.lk-touring .lk-long{display:none}
.lk-embed.lk-touring [data-tour-anchor]>.legend,.lk-embed.lk-touring [data-tour-anchor]>.lk-tline{display:inline-block;margin:0 4px 0 0;vertical-align:middle;font-size:12px}
.lk-embed.lk-touring [data-tour-anchor]>.legend span{margin-right:4px;font-size:12px}
.lk-embed.lk-touring [data-tour-anchor]>.lk-tline span{padding:0 1px}
.lk-embed.lk-touring [data-tour-anchor]>div.mut:not(.legend):not(.lk-tline){display:none}
/* 埋め込みは幅も狭いことがある（iPhone の Notion で約320px）。全文は「大きく開く」で読む。操作は1行に収める */
.lk-embed #lk-all{display:none}
.lk-embed .lk-tsub{flex-wrap:nowrap}
/* 最後の段「つまり」（関係の gist）：埋め込みでは図を畳んで文を大きく読む（#95） */
.lk-gist .lk-say{font-size:15.5px;font-weight:600}
.lk-embed.lk-gist [data-tour-anchor]{display:none}
/* 手触り（#42。knowledge-net と同じ決まり）：動きは何が変わったかを伝えるためだけ。1つの操作に動きは1つ
- 押した瞬間に少し沈む（--dur-press・--press-scale）。つまみは押している間だけ少し大きくなる
- タブを替えると、新しい中身だけがすっと出る（--dur）
- 予想の結果が出た所を一度だけ淡く光らせる（labkit.js の flash。--flash・--dur-flash）
- 動きを減らす設定では全部止める */
button{transition:transform var(--dur-press) var(--ease),background var(--dur),border-color var(--dur),color var(--dur)}
button:active:not(:disabled){transform:scale(var(--press-scale))}
input[type=range]::-webkit-slider-thumb{transition:transform var(--dur-press) var(--ease)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
.lk-in{animation:lk-in var(--dur) var(--ease)}
@keyframes lk-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important}}
.legend span{margin-right:10px;font-size:12px;white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.card{overflow-wrap:anywhere}
.mode .lk-step .lk-name{max-width:6.4em}
.vals input{font-size:15px;min-height:40px;width:100%;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
td.on{color:var(--acc2);font-weight:700}
</style></head><body>
<h1>🧪 抽出ラボ</h1>
<div id="lk-task"></div>
<div class="tabs" id="tabs"></div>
<div id="m-incl" class="mode">
<p class="mut" style="margin:0">名簿（抽出枠）N 件から n 件を単純無作為抽出すると、名簿の各件が選ばれる確率はどれも n÷N。名簿に載っていない件は選ばれない。</p>
<input type="range" id="iN" min="2" max="2000" step="1" value="100" data-name="名簿 N">
<input type="range" id="in" min="1" max="100" step="1" value="10" data-name="選ぶ n">
<input type="range" id="im" min="0" max="100" step="1" value="5" data-name="名簿の外">
<div class="row ctl"><button type="button" class="sub" id="idraw">1回抽選する</button></div>
<div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
<div class="res key" id="iplot"></div>
<div class="card res key" id="isum"></div>
</div>
<div id="m-enum" class="mode">
<p class="mut" style="margin:0">小さな母集団から n 個を選ぶ組み合わせを全部並べ、それぞれの標本平均 x̄ を出す。x̄ の散らばり方が標本分布。</p>
<div class="row ctl vals"><label style="flex:1">母集団の値 <input id="ev" value="3,5,7,9,11" inputmode="decimal" aria-label="母集団の値（カンマ区切り、2〜8個）"></label></div>
<input type="range" id="en" min="1" max="7" step="1" value="2" data-name="選ぶ n">
<input type="range" id="ec" min="0" max="20" step="0.5" value="8" data-name="基準 c">
<input type="range" id="et" min="0" max="10" step="0.5" value="1" data-name="μ±幅">
<div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
<div class="res key" id="eplot"></div>
<div class="card res key" id="esum"></div>
<div class="res det" id="etab"></div>
</div>
<div id="m-repl" class="mode">
<p class="mut" style="margin:0">戻して選ぶ（復元抽出）と、同じ件が2回以上選ばれることがある。戻さず選ぶ（非復元抽出）と重複はない。N が大きいと2つの差は小さい。</p>
<input type="range" id="rN" min="2" max="1000" step="1" value="30" data-name="名簿 N">
<input type="range" id="rn" min="1" max="60" step="1" value="5" data-name="選ぶ n">
<div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
<div class="res key" id="rplot"></div>
<div class="card res key" id="rsum"></div>
</div>
<script>

$("lk-prev").onclick=()=>tGo(T.i-1);$("lk-tnext").onclick=()=>tGo(T.i+1);$("lk-play").onclick=tPlay;$("lk-free").onclick=tFree;

function start(def){const tabs=$("tabs");
const m=cfg.mode&&modes[cfg.mode]?cfg.mode:def;

shown.forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=modes[k].name;b.dataset.m=k;b.onclick=()=>{if(!b.disabled)show(k,k!==cur);};tabs.appendChild(b);});

return {cfg,$,esc,get step(){return si;},register,show,start,stepper,setRange,formula,fmtNum,embed:EMBED,focus:FOCUS,get last(){return last;},get locked(){return locked;},value:k=>modes[cur].value(k),get mode(){return cur;},

})();
const $=LK.$,esc=LK.esc;
const W=340;
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":""};
const f=(v,d=4)=>{if(!isFinite(v))return "—";if(Math.abs(v)>=1e7){const [m,e]=v.toExponential(2).split("e");return `${+m}×10${String(+e).split("").map(c=>SUP[c]).join("")}`;}if(v!==0&&Math.abs(v)<Math.pow(10,-d)){const [m,e]=v.toExponential(2).split("e");return `${+m}×10${String(+e).split("").map(c=>SUP[c]).join("")}`;}const r=+v.toFixed(d);return String(Object.is(r,-0)?0:r);};
function lnC(n,k){if(k<0||k>n)return -Infinity;let s=0;for(let i=1;i<=k;i++)s+=Math.log(n-k+i)-Math.log(i);return s;}

let picked=[];
function iFix(){const N=+$("iN").value,e=$("in");e.max=Math.min(N,100);if(+e.value>+e.max)LK.setRange("in",+e.max);else e._lkUpd&&e._lkUpd();}
function iVals(){const N=+$("iN").value,n=Math.min(+$("in").value,N),m=+$("im").value;
const pi=n/N,pair=N>1?n*(n-1)/(N*(N-1)):0,either=1-Math.exp(lnC(N-2,n)-lnC(N,n));
return {N,n,m,pi,rate:pi,piMiss:0,cover:N/(N+m),combos:C(N,n),pair,either:N>=2?either:1};}
function iRender(){iFix();const V=iVals(),T=V.N+V.m;
if(picked.length&&(picked.length!==V.n||Math.max(...picked)>=V.N))picked=[];
let s="";
if(T<=300){const cols=20,cell=W/cols,rows=Math.ceil(T/cols),H=rows*cell+4;const on=new Set(picked);
s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="名簿と名簿の外">`;
for(let i=0;i<T;i++){const x=(i%cols)*cell,y=Math.floor(i/cols)*cell+2,inF=i<V.N;
s+=`<rect x="${x+1.5}" y="${y+1.5}" width="${cell-3}" height="${cell-3}" rx="3" fill="${on.has(i)?"var(--acc2)":inF?"var(--acc)":"none"}" fill-opacity="${on.has(i)?.9:inF?.25:1}" stroke="${inF?"none":"var(--mut)"}" stroke-dasharray="3 2"/>`;}
s+=`</svg>`;}
else{const w1=V.N/T*(W-2);s=`<svg viewBox="0 0 ${W} 40" width="${W}" role="img" aria-label="名簿の割合"><rect x="1" y="8" width="${w1}" height="22" rx="4" fill="var(--acc)" fill-opacity=".35"/><rect x="${1+w1}" y="8" width="${W-2-w1}" height="22" rx="4" fill="none" stroke="var(--mut)" stroke-dasharray="3 2"/></svg>`;}
$("iplot").innerHTML=s+`<div class="legend mut"><span><i class="sw" style="background:var(--acc);opacity:.4"></i>名簿 ${V.N}</span><span><i class="sw" style="border:1.5px dashed var(--mut)"></i>名簿の外 ${V.m}</span>${picked.length?`<span><i class="sw" style="background:var(--acc2)"></i>選ばれた ${picked.length}</span>`:""}</div>`;
$("isum").innerHTML=`<div>名簿の各件が選ばれる確率＝n÷N＝${V.n}÷${V.N}＝<b>${f(V.pi)}</b>（抽出率）</div><div>名簿の外の件が選ばれる確率＝<b>0</b>　名簿が全体を覆う割合＝${V.N}÷${T}＝<b>${f(V.cover)}</b></div><div>選び方は ${V.N}C${V.n}＝${f(V.combos,0)} 通りで、どれも同じ確率。特定の2件がどちらも入る＝${f(V.pair)}、どちらか一方でも入る＝${f(V.either)}</div><div class="mut">n を増やしても、名簿の外の件は選ばれない。結論を言えるのは名簿の範囲まで。</div>`;}
LK.register("incl",{name:"選ばれる確率",
init(){["iN","in","im"].forEach(id=>LK.stepper($(id),()=>{picked=[];iRender();}));
$("idraw").onclick=()=>{const V=iVals(),a=[...Array(V.N).keys()];for(let i=0;i<V.n;i++){const j=i+Math.floor(rnd()*(V.N-i));[a[i],a[j]]=[a[j],a[i]];}picked=a.slice(0,V.n);iRender();};iRender();},
apply(s){if(s.N!==undefined)LK.setRange("iN",s.N);iFix();if(s.n!==undefined)LK.setRange("in",s.n);if(s.m!==undefined)LK.setRange("im",s.m);iRender();},
render:iRender,
value(key){const V=iVals(),v=V[key];return {v,text:f(v,key==="combos"?0:4)};}});
function eParse(){const xs=$("ev").value.split(/[,、，\s]+/).map(Number).filter(x=>isFinite(x)&&String(x)!=="");return xs.slice(0,8);}
function combos(N,n){const out=[],cur=[];(function rec(st){if(cur.length===n){out.push(cur.slice());return;}for(let i=st;i<N;i++){cur.push(i);rec(i+1);cur.pop();}})(0);return out;}
function eFix(){const xs=eParse(),N=xs.length,e=$("en");e.max=Math.max(1,N);if(+e.value>N)LK.setRange("en",Math.max(1,N));else e._lkUpd&&e._lkUpd();
if(N){const lo=Math.min(...xs),hi=Math.max(...xs);["ec"].forEach(id=>{const c=$(id);c.min=Math.floor(lo);c.max=Math.ceil(hi);if(+c.value<+c.min||+c.value>+c.max)c.value=Math.round((lo+hi)/2);c._lkUpd&&c._lkUpd();});const t=$("et");t.max=Math.max(1,Math.ceil(hi-lo));t._lkUpd&&t._lkUpd();}}
function eVals(){const xs=eParse(),N=xs.length,n=Math.min(+$("en").value,N),c=+$("ec").value,tol=+$("et").value;
if(N<2||n<1)return {N,n,xs,list:[],count:0,mu:NaN,meanmean:NaN,min:NaN,max:NaN,sdmean:NaN,pge:NaN,within:NaN,pEach:NaN,sdpop:NaN,formula:NaN,c,tol};
const mu=xs.reduce((a,b)=>a+b,0)/N,sdpop=Math.sqrt(xs.reduce((a,b)=>a+(b-mu)**2,0)/N);
const list=combos(N,n).map(ix=>({ix,m:ix.reduce((a,i)=>a+xs[i],0)/n}));const ms=list.map(o=>o.m),K=ms.length;
const mm=ms.reduce((a,b)=>a+b,0)/K,sdm=Math.sqrt(ms.reduce((a,b)=>a+(b-mm)**2,0)/K),eps=1e-9;
return {N,n,xs,list,count:K,mu,meanmean:mm,min:Math.min(...ms),max:Math.max(...ms),sdmean:sdm,sdpop,formula:N>1?sdpop/Math.sqrt(n)*Math.sqrt((N-n)/(N-1)):0,
pge:ms.filter(m=>m>=c-eps).length/K,within:ms.filter(m=>Math.abs(m-mu)<=tol+eps).length/K,pEach:1/K,c,tol};}
function eRender(){eFix();const E=eVals();if(!E.count){$("eplot").innerHTML=`<div class="mut">値を2〜8個、カンマで区切って入れる。</div>`;$("esum").innerHTML="";$("etab").innerHTML="";return;}
const lo=Math.min(...E.xs),hi=Math.max(...E.xs),L=16,R=W-16,X=x=>hi===lo?W/2:L+(x-lo)/(hi-lo)*(R-L);
const key=m=>Math.round(m*1000)/1000,cnt={};E.list.forEach(o=>{o.k=key(o.m);cnt[o.k]=(cnt[o.k]||0)+1;});
const top=Math.max(...Object.values(cnt)),r=Math.max(2.5,Math.min(7,90/top/2.2)),base=118,H=base+44,seen={};
let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="標本平均の散らばり">`;
s+=`<rect x="${X(Math.max(lo,E.mu-E.tol))}" y="10" width="${Math.max(1,X(Math.min(hi,E.mu+E.tol))-X(Math.max(lo,E.mu-E.tol)))}" height="${base-10}" fill="var(--acc)" fill-opacity=".08"/>`;
E.list.forEach(o=>{const i=seen[o.k]=(seen[o.k]||0)+1,on=o.m>=E.c-1e-9;s+=`<circle cx="${X(o.m)}" cy="${base-r-(i-1)*(2*r+1)}" r="${r}" fill="${on?"var(--acc2)":"var(--acc)"}" fill-opacity="${on?.85:.55}"/>`;});
s+=`<line x1="${L}" y1="${base}" x2="${R}" y2="${base}" stroke="var(--fg)" stroke-opacity=".5"/>`;
E.xs.forEach(x=>{s+=`<path d="M${X(x)-4} ${base+16} L${X(x)+4} ${base+16} L${X(x)} ${base+9} Z" fill="var(--mut)"/>`;});
[lo,hi].forEach(x=>s+=`<text x="${X(x)}" y="${base+29}" font-size="10" text-anchor="middle" fill="var(--fg)">${f(x,2)}</text>`);
s+=`<line x1="${X(E.mu)}" y1="6" x2="${X(E.mu)}" y2="${base}" stroke="var(--fg)" stroke-dasharray="3 3"/><text x="${X(E.mu)}" y="${base+41}" font-size="10.5" text-anchor="middle" fill="var(--fg)">μ＝${f(E.mu,3)}</text>`;
s+=`<line x1="${X(E.c)}" y1="6" x2="${X(E.c)}" y2="${base}" stroke="var(--acc2)" stroke-width="1.2"/></svg>`;
$("eplot").innerHTML=s+`<div class="legend mut"><span>● 標本1つの x̄</span><span><i class="sw" style="background:var(--acc2)"></i>x̄≧c</span><span>▲ 母集団の値</span><span><i class="sw" style="background:var(--acc);opacity:.2"></i>μ±幅</span></div>`;
$("esum").innerHTML=`<div>選び方 ${E.N}C${E.n}＝<b>${E.count}</b> 通り（どれも確率 ${f(E.pEach)}）</div><div>x̄ の最小 <b>${f(E.min,3)}</b>・最大 <b>${f(E.max,3)}</b>　全標本の x̄ の平均＝<b>${f(E.meanmean,3)}</b>（μ＝${f(E.mu,3)}）</div><div>x̄≧${f(E.c,2)} の割合＝<b>${f(E.pge)}</b>　μ±${f(E.tol,2)} に入る割合＝<b>${f(E.within)}</b></div><div class="mut">${E.n===E.N?"n＝N は全数調査：標本は1通りで、x̄ はいつも μ。":"x̄ は選び方で変わるが、全部の平均は μ に一致する。n を増やすと x̄ は μ の近くに集まる。"}</div>`;
$("etab").innerHTML=`<div class="mut">x̄ の標準偏差＝${f(E.sdmean)}（σ÷√n×√((N−n)/(N−1))＝${f(E.formula)}、σ＝${f(E.sdpop)}）</div><table><tr><th>標本</th><th>x̄</th></tr>${E.list.slice(0,70).map(o=>`<tr><td>${o.ix.map(i=>E.xs[i]).join("・")}</td><td class="${o.m>=E.c-1e-9?"on":""}">${f(o.m,3)}</td></tr>`).join("")}</table>`;}
LK.register("enum",{name:"標本を並べる",

apply(s){if(s.vals!==undefined)$("ev").value=String(s.vals);eFix();if(s.n!==undefined)LK.setRange("en",s.n);if(s.c!==undefined)LK.setRange("ec",s.c);if(s.tol!==undefined)LK.setRange("et",s.tol);eRender();},
render:eRender,

return {N,n,pDup:1-q,pNoDup:q,piRepl:1-Math.pow(1-1/N,n),piNo:Math.min(1,n/N),ordRepl:Math.pow(N,n),ordNo:n>N?0:Math.exp(lnC(N,n))*Math.exp(Array.from({length:n},(_,i)=>Math.log(i+1)).reduce((a,b)=>a+b,0))};}
function rRender(){rFix();const R=rVals(),Ns=[10,30,100,300,1000],H=150,L=34,Rx=W-12,base=H-28,top=16;
const Y=p=>base-p*(base-top),X=i=>L+(i+0.5)/Ns.length*(Rx-L);

[0,0.5,1].forEach(p=>s+=`<text x="${L-4}" y="${Y(p)+4}" font-size="10" text-anchor="end" fill="var(--mut)">${p}</text><line x1="${L}" y1="${Y(p)}" x2="${Rx}" y2="${Y(p)}" stroke="var(--line)" stroke-dasharray="2 3"/>`);
Ns.forEach((N,i)=>{let q=1;for(let k=0;k<R.n;k++)q*=1-k/N;const p=R.n>N?1:1-q;s+=`<rect x="${X(i)-14}" y="${Y(p)}" width="28" height="${base-Y(p)}" rx="3" fill="var(--acc)" fill-opacity=".5"/><text x="${X(i)}" y="${base+13}" font-size="10" text-anchor="middle" fill="var(--fg)">N＝${N}</text>`;});
s+=`<text x="${Rx}" y="12" font-size="10" text-anchor="end" fill="var(--mut)">n＝${R.n} で戻して選ぶとき、重複が起きる確率</text></svg>`;
$("rplot").innerHTML=s;

LK.register("repl",{name:"戻す・戻さない",
