<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>探究ラボ</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#5d6670;--line:#d0d7de;--card:#f6f8fa;--acc:#0b63c9;--acc2:#b0306f;--ok:#1a7f37;--ng:#cf222e;--task:#fff8e6;--taskline:#e3c26b}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e6edf3;--mut:#a3adb8;--line:#3d444d;--card:#252525;--acc:#4c9bff;--acc2:#e06aa8;--ok:#3fb950;--ng:#f85149;--task:#2b2617;--taskline:#7a6526}}
*{box-sizing:border-box}
body{margin:0;padding:12px 14px 20px;font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%}
h1{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 10px}
.tabs button{flex:1 1 30%;min-height:40px;padding:6px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs button:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
label{font-size:14px;display:flex;align-items:center;gap:6px}
select{font-size:15px;min-height:40px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.big{font-size:18px;font-weight:700}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
button.act,button.sub{min-height:44px;padding:8px 14px;border-radius:10px;font-size:15px;cursor:pointer}
button.act{border:1px solid var(--acc);background:var(--acc);color:#fff}
button.sub{border:1px solid var(--line);background:var(--card);color:var(--fg)}
button:disabled{opacity:.45}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right;vertical-align:top}
td:first-child,th:first-child{text-align:left}
svg{max-width:100%;height:auto;display:block}
/* −／＋ 付きスライダー */
.lk-step{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.lk-step .lk-name{font-size:14px;min-width:4.5em}
.lk-step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;line-height:1;cursor:pointer;flex:none}
.lk-step input[type=range]{flex:1 1 90px;min-width:90px;height:32px}
.lk-step .lk-val{font-weight:700;min-width:4.2em;text-align:right}
/* 課題カード */
.lk-task{background:var(--task);border:1px solid var(--taskline);border-radius:12px;padding:10px 12px;margin:6px 0 4px}
.lk-task .lk-tt{font-weight:700;margin-bottom:2px}
.lk-task input[type=number]{font-size:17px;width:7.5em;min-height:44px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.lk-choices{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.lk-choices button{min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;cursor:pointer}
.lk-choices button.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.lk-skip{background:none;border:none;color:var(--mut);text-decoration:underline;font-size:13px;cursor:pointer;min-height:44px}
.lk-verdict{margin-top:6px;padding-top:6px;border-top:1px dashed var(--taskline)}
/* 予想する前は結果を隠す */
.lk-locked .res{display:none}
.lk-locked .ctl{pointer-events:none;opacity:.5}
.lk-wait{display:none}
.lk-locked .lk-wait{display:block}
/* 式で計算 */
.lk-formula{border-left:3px solid var(--acc);padding:4px 10px;margin:8px 0;font-size:14px}
.lk-formula .lk-ft{font-size:12px;color:var(--mut)}
.lk-formula div.l{font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
/* スマホの操作感：タップで拡大しない・ダブルタップの遅れをなくす・スライダーのつまみを大きく */
button,a,input,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select{font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:40px;margin:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:var(--acc);border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.lk-step{display:grid;grid-template-columns:auto 40px minmax(60px,1fr) 40px auto;gap:6px;align-items:center;flex-wrap:nowrap}
.lk-step .lk-name{min-width:0;font-size:13px;line-height:1.25;max-width:4.5em}
.lk-step button{width:40px;height:40px}
.lk-step input[type=range]{min-width:0;width:100%;height:40px}
.lk-step .lk-val{min-width:3.4em;font-size:14px}
.lk-fixed{font-size:14px}
.lk-why{margin-top:4px;font-size:14px}
.lk-live{margin-top:6px;padding:4px 8px;border-radius:8px;background:var(--bg);font-size:14px}
.lk-bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.lk-link{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--acc);font-size:14px;text-decoration:none;cursor:pointer}
/* Notion の埋め込み（高さ約320px）：要点と操作だけ */
body.lk-embed{padding:8px 12px 10px}
.lk-embed h1{display:none}
.lk-embed .lk-task{margin-top:0}
.lk-embed .lk-tt,.lk-embed .lk-note{display:none}
.lk-embed .lk-q::before{content:"🎯 "}
.lk-embed.lk-locked .ctl{display:none}
.lk-embed.lk-locked .lk-wait{display:none}
.lk-embed.lk-focus .mode>p.mut{display:none}
.lk-embed.lk-pred:not(.lk-more) .mode .res,.lk-embed.lk-pred:not(.lk-more) .mode .det{display:none}
[hidden]{display:none!important}
.lk-step .lk-name{max-width:5.2em;white-space:nowrap}
.lk-embed .lk-done .lk-q{display:none}
.lk-embed .lk-done .lk-verdict{border-top:0;margin-top:0;padding-top:0}
.lk-embed.lk-pred:not(.lk-more) .mode .res.key{display:block}
body.lk-embed.lk-locked.lk-pred .mode .res.key{display:none}
/* 法則を見つける：条件ごとの予想と結果の記録、最後の式 */
.lk-hist{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 6px}
.lk-hist th,.lk-hist td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
.lk-law{margin-top:8px;padding:8px 10px;border-left:4px solid var(--acc);background:var(--card,transparent)}
.lk-law .l{font-size:14px;line-height:1.6;padding-left:.6em;text-indent:-.6em}
.lk-law .l::before{content:"・"}
.lk-limit{margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--task);font-size:13px}
/* 解説付き再生（#90）：上に図、すぐ下に今の説明、その下に前へ／再生／次へ */
.lk-tour{background:var(--task);border:1px solid var(--taskline);border-radius:12px;padding:8px 12px;margin:6px 0}
.lk-tour .lk-tt{font-weight:700;font-size:13px;color:var(--mut)}
.lk-say{font-size:15px;line-height:1.55;margin:2px 0 6px}
.lk-say mark,.lk-tlist mark{background:none;color:inherit;font-weight:700;box-shadow:inset 0 -0.45em 0 rgba(255,196,0,.45)}
.lk-tctl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px}
.lk-tctl button{min-height:44px;padding:6px 4px;font-size:15px}
.lk-tsub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lk-tlist{margin:6px 0 0;padding-left:1.4em;font-size:14px}
.lk-tlist button{background:none;border:none;color:var(--fg);text-align:left;padding:6px 0;font:inherit;cursor:pointer;min-height:40px}
.lk-tlist li.on button{color:var(--acc)}
.lk-tfree{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.lk-touring:not(.lk-free) .mode .ctl,.lk-touring:not(.lk-free) .mode>p.mut{display:none}
.lk-hl{outline:3px solid #f0b400;outline-offset:2px;border-radius:6px}
.lk-embed.lk-touring .mode .det{display:none}
.lk-embed.lk-touring:not(.lk-free) .mode .res.key:not([data-tour-anchor]){display:none}
.lk-embed .lk-tour{padding:6px 10px;margin:4px 0}
.lk-embed .lk-say{font-size:14px;margin:0 0 4px}
.lk-embed .lk-tsub{margin-top:4px}
.lk-embed .lk-tsub .lk-link{min-height:36px;padding:4px 10px;font-size:13px}
.lk-tline{font-size:13px;margin-top:2px}.lk-tline span{display:inline-block;padding:0 3px}
.lk-tno{display:none;font-weight:700;color:var(--mut)}
.lk-embed .lk-tour .lk-tt{display:none}
.lk-embed .lk-tno{display:inline}
.lk-embed .lk-tctl button{min-height:40px}
.lk-embed.lk-touring #lk-tour~*,.lk-embed.lk-touring .lk-long{display:none}
.lk-embed.lk-touring [data-tour-anchor]>.legend,.lk-embed.lk-touring [data-tour-anchor]>.lk-tline{display:inline-block;margin:0 4px 0 0;vertical-align:middle;font-size:12px}
.lk-embed.lk-touring [data-tour-anchor]>.legend span{margin-right:4px;font-size:12px}
.lk-embed.lk-touring [data-tour-anchor]>.lk-tline span{padding:0 1px}
.legend span{margin-right:10px;font-size:12px;white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.card{overflow-wrap:anywhere}
.ctl label{margin-right:6px}
.log{font-size:13px;margin:4px 0;padding-left:1.2em}
.log li{margin:2px 0}
.qs{font-size:13px;line-height:1.6}
</style></head><body>
<h1>🧪 探究ラボ</h1>
<div id="lk-task"></div>
<div class="tabs" id="tabs"></div>
<div id="m-sandbox" class="mode">
<p class="mut" style="margin:0">2店の120日分のデータ（架空）。何を見るか・どう分けるか・どこに絞るか・どの図で見るかを自分で決める。答えは1つではない。統計で言えることと、自分の解釈を分けて考える。</p>
<div class="row ctl"><label>見る値 <select id="xv" data-key="value"><option value="sales">売上（万円）</option><option value="cust">客数（人）</option><option value="ticket">客単価（円）</option></select></label></div>
<div class="row ctl"><label>分ける <select id="xg" data-key="group"><option value="none">分けない</option><option value="camp">キャンペーン</option><option value="week">平日／週末</option><option value="weather">天気</option><option value="store">店</option><option value="half">前半／後半</option></select></label></div>
<div class="row ctl"><label>絞る <select id="xf" data-key="filter"><option value="all">全部の日</option><option value="weekday">平日だけ</option><option value="weekend">週末だけ</option><option value="A">A店だけ</option><option value="B">B店だけ</option><option value="noevent">特別な日を除く</option></select></label></div>
<div class="row ctl"><label>図 <select id="xc" data-key="chart"><option value="box">箱ひげ図</option><option value="dots">点</option><option value="hist">ヒストグラム</option><option value="time">日付の順</option><option value="scatter">散布図</option><option value="cross">クロス集計</option></select></label></div>
<div class="row ctl" id="xsrow"><label>横軸・列 <select id="xs" data-key="second"><option value="cust">客数</option><option value="ticket">客単価</option><option value="sales">売上</option><option value="day">日付</option><option value="week">平日／週末</option><option value="weather">天気</option><option value="camp">キャンペーン</option><option value="store">店</option></select></label></div>
<div class="res key" id="xplot"></div>
<div class="card res key" id="xsum"></div>
<div class="card res det" id="xlog"></div>
<div class="card res det qs" id="xq"></div>
</div>
<script>
window.__LABPRESETS__={"s6-camp": {"mode": "sandbox", "set": {"value": "sales", "group": "camp", "filter": "all", "chart": "box"}, "task": "「キャンペーンの日は売上が高い。だからキャンペーンは効いている」と言えるか。分け方・絞り方・図を変えて、差が何によって生まれているかを探る。"}, "s6-cross": {"mode": "sandbox", "set": {"value": "sales", "group": "camp", "filter": "all", "chart": "cross", "second": "week"}, "task": "キャンペーンの有無と平日／週末は独立か。偏りがあると、売上の比べ方にどう効くか。分け方と列を切り替えて探る。"}, "s6-scatter": {"mode": "sandbox", "set": {"value": "sales", "group": "store", "filter": "all", "chart": "scatter", "second": "cust"}, "task": "売上と客数・客単価・日付の散布図を、店で色分けして見る。全体の相関と店ごとの相関、特別な日の点の効き方を比べる。"}, "s6-reg": {"mode": "sandbox", "set": {"value": "sales", "group": "half", "filter": "B", "chart": "scatter", "second": "cust"}, "task": "客数から売上を1本の直線で予測してよいか。店・前半／後半で分け、特別な日を除いて、点の並び方を比べる。"}, "s6-adjust": {"mode": "sandbox", "set": {"value": "sales", "group": "camp", "filter": "weekday", "chart": "box"}, "task": "キャンペーンの効果は、何をそろえれば言えるか。平日だけ・週末だけ・店だけに絞り、分け方や図を変えて、そろえる条件で差がどう変わるかを見る。"}, "s6-design": {"mode": "sandbox", "set": {"value": "sales", "group": "camp", "filter": "all", "chart": "cross", "second": "week"}, "task": "キャンペーンの日は売上が高いが、キャンペーンは週末に多い。この観察データで言えることと言えないことを分け、効果を確かめるならどの日にキャンペーンをするかをどう決めるかを考える。"}, "s6-free": {"mode": "sandbox", "task": "自分で問いを立て、見る値・分け方・絞り方・図を選んで動かす。統計で言えることと、自分の解釈を分けて書く。"}};window.__LABCFG__=(function(){try{var p=new URLSearchParams(location.search).get("p");return (p&&window.__LABPRESETS__[p])||{};}catch(e){return {};}})();
const LK=(()=>{
const cfg=window.__LABCFG__||{};
const STEPS=Array.isArray(cfg.steps)&&cfg.steps.length?cfg.steps:null;let si=0;const hist=[];
if(STEPS){const s0=STEPS[0];cfg.task=s0.task;cfg.predict=s0.predict;cfg.why=s0.why;}
const $=id=>document.getElementById(id);
const modes={},order=[];let cur=null,locked=false,last=null,revealed=false,moved=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EMBED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})()||/[?&]embed=1/.test(location.search);
const FOCUS=!!(cfg.task&&cfg.mode);
function register(key,spec){modes[key]=spec;order.push(key);}
function show(k){cur=k;order.forEach(m=>{$("m-"+m).style.display=m===k?"block":"none";});
document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===k));
if(modes[k].render)modes[k].render();live();}
function fmtNum(v){if(typeof v!=="number")return String(v);return String(+v.toFixed(3));}
function stepper(input,onchange){
const wrap=document.createElement("div");wrap.className="lk-step ctl";
const name=document.createElement("span");name.className="lk-name";name.textContent=input.dataset.name||"";
const minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.setAttribute("aria-label",(input.dataset.name||"")+"を下げる");
const plus=document.createElement("button");plus.type="button";plus.textContent="＋";plus.setAttribute("aria-label",(input.dataset.name||"")+"を上げる");
const val=document.createElement("span");val.className="lk-val";
input.parentNode.insertBefore(wrap,input);wrap.append(name,minus,input,plus,val);
const step=()=>+input.step||1,dec=()=>Math.max(0,(String(input.step).split(".")[1]||"").length);
const upd=()=>{val.textContent=(+input.value).toFixed(dec())+(input.dataset.unit||"");};
const bump=d=>{const v=Math.min(+input.max,Math.max(+input.min,+input.value+d*step()));input.value=v.toFixed(dec());upd();onchange&&onchange();};
minus.onclick=()=>bump(-1);plus.onclick=()=>bump(1);
input.addEventListener("input",()=>{upd();onchange&&onchange();});
input._lkUpd=upd;upd();return wrap;}
function setRange(id,v){const e=$(id);e.value=v;e._lkUpd&&e._lkUpd();}
function formula(lines,title){return `<div class="lk-formula res"><div class="lk-ft">${esc(title||"式で計算")}</div>${lines.map(l=>`<div class="l">${esc(l)}</div>`).join("")}</div>`;}
function fixPicks(){if(!cfg.predict||!cfg.set)return;
Object.keys(cfg.set).filter(k=>!(cfg.unlock||[]).includes(k)).forEach(k=>{const el=document.querySelector(`#m-${cur} select[data-key="${k}"]`);if(!el)return;
const lab=el.closest("label"),name=lab?lab.firstChild.textContent.trim():"";
const t=document.createElement("span");t.className="lk-fixed";t.innerHTML=`${esc(name)}：<b>${esc(el.options[el.selectedIndex].text)}</b>`;
el.style.display="none";(lab||el).after(t);if(lab)lab.style.display="none";});}
const web=/^https?:$/.test(location.protocol);
function bar(){const b=$("lk-bar");if(!b)return;let h="";
if(EMBED&&FOCUS&&cfg.predict)h+=`<button type="button" class="lk-link" id="lk-more" aria-expanded="false">くわしく（表・式）▾</button>`;
if(EMBED&&web)h+=`<a class="lk-link" href="${esc(location.href.replace(/[?&]embed=1\b/,""))}" target="_blank" rel="noopener">大きく開く ↗</a>`;
if(FOCUS&&web&&window.__LABPRESETS__)h+=`<a class="lk-link" href="./" target="_blank" rel="noopener">ほかのモードも試す ↗</a>`;
b.innerHTML=h;b.hidden=!h;const m=$("lk-more");
if(m)m.onclick=()=>{const on=!document.body.classList.contains("lk-more");document.body.classList.toggle("lk-more",on);m.setAttribute("aria-expanded",on);m.textContent=on?"たたむ ▴":"くわしく（表・式）▾";};}
function taskCard(){const box=$("lk-task");if(!cfg.task){box.remove();return;}
const p=cfg.predict;const head=STEPS?`🔍 法則を見つける ${si+1}／${STEPS.length}`:"🎯 課題";let h=`<div class="lk-task"><div class="lk-tt">${head}</div>${STEPS&&hist.length?histTable():""}<div class="lk-q">${esc(cfg.task)}</div>`;
if(p){h+=`<div id="lk-ask"><div class="mut lk-note">先に予想を決める。決めるまで結果は隠れている。</div>`;
if(p.type==="number")h+=`<div class="row"><label>${esc(p.label||"予想")} <input type="number" id="lk-in" inputmode="decimal" step="any">${esc(p.unit||"")}</label></div>`;
else h+=`<div class="mut">${esc(p.label||"予想")}</div><div class="lk-choices" id="lk-ch">${p.options.map(o=>`<button type="button" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
h+=`<div class="row"><button class="act" id="lk-go" disabled>予想を決めて確かめる</button><button class="lk-skip" id="lk-skip">予想せずに見る</button></div></div>`;}
h+=`<div id="lk-verdict"></div></div>`;box.innerHTML=h;
if(!p)return;
let guess=null;const go=$("lk-go");
if(p.type==="number")$("lk-in").addEventListener("input",e=>{guess=e.target.value===""?null:+e.target.value;go.disabled=guess===null||isNaN(guess);});
else $("lk-ch").querySelectorAll("button").forEach(b=>b.onclick=()=>{guess=b.dataset.v;$("lk-ch").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));go.disabled=false;});
go.onclick=()=>reveal(guess);$("lk-skip").onclick=()=>reveal(null);}
function lock(on){locked=on;document.body.classList.toggle("lk-locked",on);
document.querySelectorAll("#tabs button").forEach(b=>b.disabled=on&&b.dataset.m!==cur);}
function live(){const el=$("lk-live");if(!el||!revealed||!moved)return;el.hidden=false;const p=cfg.predict,r=modes[cur].value(p.key);
el.innerHTML=`動かすと変わる → ${esc(p.label||"結果")}：<b>${esc(r.text)}</b>`;}
function reveal(guess){const p=cfg.predict;lock(false);revealed=true;if(modes[cur].render)modes[cur].render();

$("xq").innerHTML=`<div class="lk-ft">考えるための問い（答えは1つではない）</div><div>・いま見えている差は、何と何の差か。ほかに同時に違っているものはないか。</div><div>・分け方や絞り方を変えると、差はどう変わったか。変わらなかったものは何か。</div><div>・統計で言えること（この日数・このデータで）と、自分の解釈（理由の見立て・判断）を分けて書く。</div><div>・解釈を確かめるには、次にどんなデータを、どう集めればよいか。</div>`;}
function corr(a,b){const n=a.length,ma=a.reduce((s,x)=>s+x,0)/n,mb=b.reduce((s,x)=>s+x,0)/n;let sab=0,saa=0,sbb=0;for(let i=0;i<n;i++){sab+=(a[i]-ma)*(b[i]-mb);saa+=(a[i]-ma)**2;sbb+=(b[i]-mb)**2;}return sab/Math.sqrt(saa*sbb);}
function ticks(lo,hi,y,X){const r=hi-lo,st=r>600?200:r>200?50:r>60?20:r>25?10:5;let h="";for(let t=Math.ceil(lo/st)*st;t<=hi;t+=st)h+=`<text x="${X(t)}" y="${y}" font-size="11" text-anchor="middle" fill="var(--mut)">${t}</text>`;return h;}

render,
value(key){const C=cur();if(key==="diff"&&C.st.length===2){const v=C.st[1].S.mean-C.st[0].S.mean;return {v,text:f(v)};}return {v:null,text:"—"};}});
