<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>二項分布ラボ</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#5d6670;--line:#d0d7de;--card:#f6f8fa;--acc:#0b63c9;--acc2:#b0306f;--ok:#1a7f37;--ng:#cf222e;--task:#fff8e6;--taskline:#e3c26b}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e6edf3;--mut:#a3adb8;--line:#3d444d;--card:#252525;--acc:#4c9bff;--acc2:#e06aa8;--ok:#3fb950;--ng:#f85149;--task:#2b2617;--taskline:#7a6526}}
*{box-sizing:border-box}
body{margin:0;padding:12px 14px 20px;font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%}
h1{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 10px}
.tabs button{flex:1 1 30%;min-height:40px;padding:6px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs button:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
label{font-size:14px;display:flex;align-items:center;gap:6px}
select{font-size:15px;min-height:40px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.big{font-size:18px;font-weight:700}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
button.act,button.sub{min-height:44px;padding:8px 14px;border-radius:10px;font-size:15px;cursor:pointer}
button.act{border:1px solid var(--acc);background:var(--acc);color:#fff}
button.sub{border:1px solid var(--line);background:var(--card);color:var(--fg)}
button:disabled{opacity:.45}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right;vertical-align:top}
td:first-child,th:first-child{text-align:left}
svg{max-width:100%;height:auto;display:block}
/* −／＋ 付きスライダー */
.lk-step{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.lk-step .lk-name{font-size:14px;min-width:4.5em}
.lk-step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;line-height:1;cursor:pointer;flex:none}
.lk-step input[type=range]{flex:1 1 90px;min-width:90px;height:32px}
.lk-step .lk-val{font-weight:700;min-width:4.2em;text-align:right}
/* 課題カード */
.lk-task{background:var(--task);border:1px solid var(--taskline);border-radius:12px;padding:10px 12px;margin:6px 0 4px}
.lk-task .lk-tt{font-weight:700;margin-bottom:2px}
.lk-task input[type=number]{font-size:17px;width:7.5em;min-height:44px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.lk-choices{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.lk-choices button{min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;cursor:pointer}
.lk-choices button.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.lk-skip{background:none;border:none;color:var(--mut);text-decoration:underline;font-size:13px;cursor:pointer;min-height:44px}
.lk-verdict{margin-top:6px;padding-top:6px;border-top:1px dashed var(--taskline)}
/* 予想する前は結果を隠す */
.lk-locked .res{display:none}
.lk-locked .ctl{pointer-events:none;opacity:.5}
.lk-wait{display:none}
.lk-locked .lk-wait{display:block}
/* 式で計算 */
.lk-formula{border-left:3px solid var(--acc);padding:4px 10px;margin:8px 0;font-size:14px}
.lk-formula .lk-ft{font-size:12px;color:var(--mut)}
.lk-formula div.l{font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
/* スマホの操作感：タップで拡大しない・ダブルタップの遅れをなくす・スライダーのつまみを大きく */
button,a,input,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select{font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:40px;margin:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:var(--acc);border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.lk-step{display:grid;grid-template-columns:auto 40px minmax(60px,1fr) 40px auto;gap:6px;align-items:center;flex-wrap:nowrap}
.lk-step .lk-name{min-width:0;font-size:13px;line-height:1.25;max-width:4.5em}
.lk-step button{width:40px;height:40px}
.lk-step input[type=range]{min-width:0;width:100%;height:40px}
.lk-step .lk-val{min-width:3.4em;font-size:14px}
.lk-fixed{font-size:14px}
.lk-why{margin-top:4px;font-size:14px}
.lk-live{margin-top:6px;padding:4px 8px;border-radius:8px;background:var(--bg);font-size:14px}
.lk-bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.lk-link{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--acc);font-size:14px;text-decoration:none;cursor:pointer}
/* Notion の埋め込み（高さ約320px）：要点と操作だけ */
body.lk-embed{padding:8px 12px 10px}
.lk-embed h1{display:none}
.lk-embed .lk-task{margin-top:0}
.lk-embed .lk-tt,.lk-embed .lk-note{display:none}
.lk-embed .lk-q::before{content:"🎯 "}
.lk-embed.lk-locked .ctl{display:none}
.lk-embed.lk-locked .lk-wait{display:none}
.lk-embed.lk-focus .mode>p.mut{display:none}
.lk-embed.lk-pred:not(.lk-more) .mode .res,.lk-embed.lk-pred:not(.lk-more) .mode .det{display:none}
[hidden]{display:none!important}
.lk-step .lk-name{max-width:5.2em;white-space:nowrap}
.lk-embed .lk-done .lk-q{display:none}
.lk-embed .lk-done .lk-verdict{border-top:0;margin-top:0;padding-top:0}
.lk-embed.lk-pred:not(.lk-more) .mode .res.key{display:block}
body.lk-embed.lk-locked.lk-pred .mode .res.key{display:none}
/* 法則を見つける：条件ごとの予想と結果の記録、最後の式 */
.lk-hist{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 6px}
.lk-hist th,.lk-hist td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
.lk-law{margin-top:8px;padding:8px 10px;border-left:4px solid var(--acc);background:var(--card,transparent)}
.lk-law .l{font-size:14px;line-height:1.6;padding-left:.6em;text-indent:-.6em}
.lk-law .l::before{content:"・"}
.lk-limit{margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--task);font-size:13px}
/* 解説付き再生（#90）：上に図、すぐ下に今の説明、その下に前へ／再生／次へ */
.lk-tour{background:var(--task);border:1px solid var(--taskline);border-radius:12px;padding:8px 12px;margin:6px 0}
.lk-tour .lk-tt{font-weight:700;font-size:13px;color:var(--mut)}
.lk-say{font-size:15px;line-height:1.55;margin:2px 0 6px}
.lk-say mark,.lk-tlist mark{background:none;color:inherit;font-weight:700;box-shadow:inset 0 -0.45em 0 rgba(255,196,0,.45)}
.lk-tctl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px}
.lk-tctl button{min-height:44px;padding:6px 4px;font-size:15px}
.lk-tsub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lk-tlist{margin:6px 0 0;padding-left:1.4em;font-size:14px}
.lk-tlist button{background:none;border:none;color:var(--fg);text-align:left;padding:6px 0;font:inherit;cursor:pointer;min-height:40px}
.lk-tlist li.on button{color:var(--acc)}
.lk-tfree{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.lk-touring:not(.lk-free) .mode .ctl,.lk-touring:not(.lk-free) .mode>p.mut{display:none}
.lk-hl{outline:3px solid #f0b400;outline-offset:2px;border-radius:6px}
.lk-embed.lk-touring .mode .det{display:none}
.lk-embed.lk-touring:not(.lk-free) .mode .res.key:not([data-tour-anchor]){display:none}
.lk-embed .lk-tour{padding:6px 10px;margin:4px 0}
.lk-embed .lk-say{font-size:14px;margin:0 0 4px}
.lk-embed .lk-tsub{margin-top:4px}
.lk-embed .lk-tsub .lk-link{min-height:36px;padding:4px 10px;font-size:13px}
.lk-tline{font-size:13px;margin-top:2px}.lk-tline span{display:inline-block;padding:0 3px}
.lk-tno{display:none;font-weight:700;color:var(--mut)}
.lk-embed .lk-tour .lk-tt{display:none}
.lk-embed .lk-tno{display:inline}
.lk-embed .lk-tctl button{min-height:40px}
.lk-embed.lk-touring #lk-tour~*,.lk-embed.lk-touring .lk-long{display:none}
.lk-embed.lk-touring [data-tour-anchor]>.legend,.lk-embed.lk-touring [data-tour-anchor]>.lk-tline{display:inline-block;margin:0 4px 0 0;vertical-align:middle;font-size:12px}
.lk-embed.lk-touring [data-tour-anchor]>.legend span{margin-right:4px;font-size:12px}
.lk-embed.lk-touring [data-tour-anchor]>.lk-tline span{padding:0 1px}
.legend span{margin-right:10px;font-size:12px;white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.card{overflow-wrap:anywhere}
.seqs{display:flex;flex-direction:column;gap:3px;margin:6px 0;font-size:18px;line-height:1.2}
.seqs div{display:flex;align-items:center;gap:8px}
.seqs .pp{font-size:12px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}
</style></head><body>
<h1>🧪 二項分布ラボ</h1>
<div id="lk-task"></div>
<div class="tabs" id="tabs"></div>
<div id="m-pmf" class="mode">
<p class="mut" style="margin:0">成功確率 p の独立な試行を n 回（n 人）。成功する回数 X の分布 B(n, p)。k を決めて「ちょうど」「以下」「以上」の確率を見る。</p>
<input type="range" id="bn" min="1" max="100" step="1" value="4" data-name="回数 n">
<input type="range" id="bp" min="0" max="1" step="0.01" value="0.25" data-name="確率 p">
<input type="range" id="bk" min="0" max="4" step="1" value="1" data-name="k">
<div class="row ctl"><label>求める <select id="bkind" data-key="kind"><option value="eq">ちょうど k 回</option><option value="le">k 回以下</option><option value="ge">k 回以上</option></select></label>
<label>重ねる <select id="bnorm" data-key="norm"><option value="no">なし</option><option value="yes">正規分布</option></select></label></div>
<div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
<div class="res key" id="bplot"></div>
<div class="card res key" id="bsum"></div>
<div class="res det" id="btab"></div>
</div>
<div id="m-path" class="mode">
<p class="mut" style="margin:0">n 回のうちちょうど k 回成功する並びを全部書き出す。どの並びも確率は同じ pᵏ(1−p)ⁿ⁻ᵏ で、並びの数が ₙCₖ。</p>
<input type="range" id="qn" min="1" max="6" step="1" value="4" data-name="回数 n">
<input type="range" id="qp" min="0" max="1" step="0.01" value="0.25" data-name="確率 p">
<input type="range" id="qk" min="0" max="4" step="1" value="1" data-name="k">
<div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
<div class="res key" id="qplot"></div>
<div class="card res key" id="qsum"></div>
</div>
<div id="m-bern" class="mode">
<p class="mut" style="margin:0">1回だけの試行（成功1・失敗0）がベルヌーイ分布。平均 p、分散 p(1−p)。分散は p＝0.5 で最大になる。n 回分を足すと二項分布で、平均も分散も n 倍。</p>
<input type="range" id="ep" min="0" max="1" step="0.01" value="0.25" data-name="確率 p">
<input type="range" id="en" min="1" max="100" step="1" value="4" data-name="回数 n">
<div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
<div class="res key" id="eplot"></div>
<div class="card res key" id="esum"></div>
</div>
<script>
window.__LABPRESETS__={"s1-path": {"mode": "path", "set": {"n": 4, "p": 0.25, "k": 1}, "task": "購入率25%の売場に客が4人。ちょうど1人が買う確率は（小数で）？", "predict": {"type": "number", "key": "pk", "label": "P(X＝1)"}, "why": "誰が買うかの並びは4通り（₄C₁）、どれも 0.25×0.75³≒0.105。4×0.105≒0.422。0.25 だけ、0.105 だけだと並び方を数え忘れている。"}, "s1-n": {"mode": "pmf", "set": {"n": 20, "p": 0.25, "k": 5, "kind": "eq"}, "unlock": ["kind"], "task": "購入率25%の売場に客が20人。いちばん起きやすい「買う人数」は何人か。", "predict": {"type": "number", "key": "mode", "label": "いちばん起きやすい人数", "unit": "人"}, "why": "平均 np＝20×0.25＝5人の近くが山になる。n を増やすと山は右へ動き、左右対称に近づく。"}, "s3-free": {"mode": "pmf", "modes": ["pmf", "path", "bern"], "task": "解いてから、「二項分布 B(n, p)」で n・p・k と「求める」を問題に合わせて確かめる。式の ₙCₖ の意味は「並びを書き出す」、平均・分散は「ベルヌーイと np」で見る。"}, "s4-free": {"mode": "pmf", "modes": ["pmf", "bern"], "task": "自分の売場の数字（人数 n と購入率・利用率 p）を入れ、「k 人以上」「1人もいない」の確率を読む。平均 np のまわりにどれくらい散らばるかも見る。"}, "s5-norm": {"mode": "pmf", "modes": ["pmf", "bern"], "set": {"n": 60, "p": 0.3, "k": 18, "kind": "eq", "norm": "yes"}, "task": "「重ねる」を正規分布にしたまま n を小さく・大きくし、正規分布で近似できるのはどんなときかを見る。p を0.05のように小さくすると形がどう崩れるかも見る。"}, "s6-free": {"task": "自分の課題の数字で、モードを切り替えて確かめる（二項分布 B(n, p)、並びを書き出す、ベルヌーイと np）。"}, "Q-U14-001": {"mode": "path", "set": {"n": 3, "p": 0.5, "k": 2}, "task": "コインを3回投げ、ちょうど2回表（🛒を表とする）。確率は（小数で）？", "predict": {"type": "number", "key": "pk", "label": "P(X＝2)"}, "why": "表表裏・表裏表・裏表表の3通り、どれも 0.5³＝0.125。3×0.125＝0.375。"}, "Q-U14-002": {"mode": "pmf", "set": {"n": 5, "p": 0.2, "k": 2, "kind": "eq"}, "task": "n＝5、p＝0.2。ちょうど2回成功する確率は（小数で）？", "predict": {"type": "number", "key": "pk", "label": "P(X＝2)"}, "why": "10×0.04×0.512＝0.2048。平均は1回なので、いちばん起きやすいのは1回で、2回はその次。"}, "Q-U14-003": {"mode": "pmf", "set": {"n": 4, "p": 0.25, "k": 1, "kind": "ge"}, "task": "n＝4、p＝0.25。少なくとも1人（1人以上）が買う確率は（小数で）？", "predict": {"type": "number", "key": "ge", "label": "P(X≧1)"}, "why": "1人以上は「0人ではない」。1−0.75⁴＝0.6836。1〜4人の4本を足しても同じになる。"}, "Q-U14-004": {"mode": "pmf", "set": {"n": 4, "p": 0.25, "k": 2, "kind": "ge"}, "task": "n＝4、p＝0.25。少なくとも2人（2人以上）が買う確率は（小数で）？", "predict": {"type": "number", "key": "ge", "label": "P(X≧2)"}, "why": "2人以上＝1−(0人＋1人)＝1−0.3164−0.4219＝0.2617。0人を引き忘れると0.5781になる。"}, "Q-U14-005": {"mode": "pmf", "set": {"n": 20, "p": 0.05, "k": 2, "kind": "le"}, "task": "不良率5%、20個抜き取り。不良が2個以下になる確率は（小数で）？", "predict": {"type": "number", "key": "le", "label": "P(X≦2)"}, "why": "0個・1個・2個の3本を足して約0.92。p を0.1にすると合格の確率は約0.68に下がる。"}, "Q-U14-010": {"mode": "pmf", "set": {"n": 6, "p": 0.3, "k": 2, "kind": "eq"}, "task": "n＝6、p＝0.3。ちょうど2人が提示する確率は（小数で）？", "predict": {"type": "number", "key": "pk", "label": "P(X＝2)"}, "why": "15×0.09×0.2401≒0.324。平均 1.8人に近い2人がいちばん起きやすい。"}, "Q-U14-011": {"mode": "bern", "set": {"p": 0.1, "n": 50}, "task": "p＝0.1、n＝50。購入する人数の標準偏差は（小数で）？", "predict": {"type": "number", "key": "sd", "label": "標準偏差", "unit": "人"}, "why": "分散 50×0.1×0.9＝4.5、√4.5≒2.12人。1人の分散0.09を50倍して平方根。"}, "Q-U14-012": {"mode": "bern", "set": {"p": 0.25, "n": 4}, "task": "1人の購入（1/0）は p＝0.25。独立な4人分の合計の分散は（小数で）？", "predict": {"type": "number", "key": "var", "label": "合計の分散"}, "why": "1人の分散 p(1−p)＝0.1875 を4人分足して0.75。二項分布の分散 np(1−p) はこの足し算から出てくる。"}, "Q-U14-020": {"mode": "pmf", "set": {"n": 20, "p": 0.1, "k": 3, "kind": "ge"}, "task": "n＝20、p＝0.1。3人以上が使う確率は（小数で）？", "predict": {"type": "number", "key": "ge", "label": "P(X≧3)"}, "why": "3〜20人を足す代わりに、1−(0人＋1人＋2人)。平均2人なので、3人以上は3回に1回くらい。"}, "Q-U14-021": {"mode": "pmf", "set": {"n": 9, "p": 0.25, "k": 1, "kind": "ge"}, "task": "n＝9、p＝0.25。少なくとも1人が買う確率は（小数で）？ 0.9を超えているか。", "predict": {"type": "number", "key": "atleast1", "label": "P(X≧1)"}, "why": "1−0.75⁹≒0.925 で0.9を超える。n を8にすると0.8999で、わずかに届かない。"}, "Q-U14-022": {"mode": "pmf", "set": {"n": 20, "p": 0.3, "k": 6, "kind": "eq"}, "task": "B(20, 0.3) の分散は（小数で）？ 平均6・分散4.2 になっているか確かめる。", "predict": {"type": "number", "key": "var", "label": "分散 np(1−p)"}, "why": "20×0.3×0.7＝4.2。分散を平均で割ると 1−p が出る。分散は平均より必ず小さい（1−p＜1）。"}, "Q-U14-023": {"mode": "pmf", "set": {"n": 10, "p": 0.5, "k": 5, "kind": "eq"}, "task": "コインを10回投げる。表がちょうど5回の <div class="lk-tctl"><button type="button" class="sub" id="lk-prev" ${T.i?"":"disabled"}>◀ 前へ</button><button type="button" class="act" id="lk-play" ${n?"":"disabled"} aria-label="${playing?"一時停止":"再生"}">${!n?"動きなし":playing?"⏸ 一時停止":done?"↺ もう一度":"▶ 再生"}</button><button type="button" class="sub" id="lk-tnext" ${T.i<N-1?"":"disabled"}>次へ ▶</button></div>
<div class="lk-tsub"><button type="button" class="lk-link" id="lk-free">✋ <span class="lk-long">自分で</span>動かす</button><button type="button" class="lk-link" id="lk-all" aria-expanded="false">全文 ▾</button>${big}</div>
<ol class="lk-tlist" id="lk-tlist" hidden>${TOUR.steps.map((x,k)=>`<li class="${k===T.i?"on":""}"><button type="button" data-i="${k}">${say(x.text)}</button></li>`).join("")}</ol>`;
$("lk-prev").onclick=()=>tGo(T.i-1);$("lk-tnext").onclick=()=>tGo(T.i+1);$("lk-play").onclick=tPlay;$("lk-free").onclick=tFree;
const all=$("lk-all");all.onclick=()=>{const l=$("lk-tlist"),on=l.hidden;l.hidden=!on;all.setAttribute("aria-expanded",on);all.textContent=on?"全文 ▴":"全文 ▾";};
box.querySelectorAll("#lk-tlist button").forEach(b=>b.onclick=()=>tGo(+b.dataset.i));}
function tourStart(){T.states=tourStates();document.body.classList.add("lk-touring");const t=$("lk-task");if(t)t.remove();
const m=$("m-"+cur),anchor=m.querySelector("[data-tour-anchor]")||m.querySelector(".res.key")||m.lastElementChild;
const box=document.createElement("div");box.id="lk-tour";box.className="lk-tour";anchor.after(box);
m.addEventListener("input",()=>{if(!T.free)tFree();});
tGo(0);$("lk-bar").hidden=true;}
function start(def){const tabs=$("tabs");
const m=cfg.mode&&modes[cfg.mode]?cfg.mode:def;
const shown=(cfg.modes||(cfg.mode?[cfg.mode]:order)).filter(k=>modes[k]);
shown.forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=modes[k].name;b.dataset.m=k;b.onclick=()=>{if(!b.disabled)show(k);};tabs.appendChild(b);});
if(shown.length<2)tabs.hidden=true;
document.body.classList.toggle("lk-embed",EMBED);document.body.classList.toggle("lk-focus",FOCUS);document.body.classList.toggle("lk-pred",!!(FOCUS&&cfg.predict));
if(!$("lk-bar")){const b=document.createElement("div");b.id="lk-bar";b.className="lk-bar";document.body.appendChild(b);}
order.forEach(k=>modes[k].init&&modes[k].init());
if(cfg.set&&modes[m].apply)modes[m].apply(cfg.set);
if(STEPS&&STEPS[0].set&&modes[m].apply)modes[m].apply(STEPS[0].set);
show(m);if(TOUR){tourStart();return;}fixPicks();taskCard();if(cfg.predict)lock(true);
if(!cfg.predict){const t=$("lk-task");if(t&&EMBED)t.after($("lk-bar"));bar();}else $("lk-bar").hidden=true;
["input","change","click"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest(".mode"))moved=true;setTimeout(live,0);}));}
return {cfg,$,esc,get step(){return si;},register,show,start,stepper,setRange,formula,fmtNum,embed:EMBED,focus:FOCUS,get last(){return last;},get locked(){return locked;},value:k=>modes[cur].value(k),get mode(){return cur;},
tour:TOUR?{go:tGo,frame:tFrame,play:tPlay,free:tFree,back:tBack,get state(){return {i:T.i,f:T.f,free:T.free,playing:!!T.timer};}}:null};
})();
const $=LK.$,esc=LK.esc;
const W=340;
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
const f=(v,d=4)=>{if(!isFinite(v))return "—";if(v!==0&&Math.abs(v)<Math.pow(10,-d)){const [m,e]=v.toExponential(2).split("e");return `${+m}×10${String(+e).split("").map(c=>SUP[c]).join("")}`;}const r=+v.toFixed(d);return String(Object.is(r,-0)?0:r);};
function C(n,k){if(k<0||k>n)return 0;k=Math.min(k,n-k);let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);}
function pmf(n,p,k){if(k<0||k>n)return 0;return C(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k);}
const phi=z=>Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
function fixK(nId,kId){const n=+$(nId).value,e=$(kId);e.max=n;if(+e.value>n)LK.setRange(kId,n);else e._lkUpd&&e._lkUpd();}
function bVals(){const n=+$("bn").value,p=+$("bp").value,k=Math.min(+$("bk").value,n),kind=$("bkind").value;
const ps=[];for(let i=0;i<=n;i++)ps.push(pmf(n,p,i));let le=0,ge=0;ps.forEach((q,i)=>{if(i<=k)le+=q;if(i>=k)ge+=q;});
const mean=n*p,vr=n*p*(1-p);return {n,p,k,kind,ps,pk:ps[k],le,ge,mean,var:vr,sd:Math.sqrt(vr),p0:ps[0],atleast1:1-ps[0],sel:kind==="eq"?ps[k]:kind==="le"?le:ge,mode:ps.indexOf(Math.max(...ps))};}
function bRender(){fixK("bn","bk");const B=bVals(),H=180,L=30,R=W-10,base=H-28,top=22,mx=Math.max(...B.ps,0.01);
const X=i=>L+(i+0.5)/(B.n+1)*(R-L),Y=q=>base-q/mx*(base-top),bw=Math.max(2,Math.min(30,(R-L)/(B.n+1)*0.75));
const on=i=>B.kind==="eq"?i===B.k:B.kind==="le"?i<=B.k:i>=B.k;
let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="二項分布"><line x1="${L}" y1="${base}" x2="${R}" y2="${base}" stroke="var(--line)"/>`;
B.ps.forEach((q,i)=>{s+=`<rect x="${X(i)-bw/2}" y="${Y(q)}" width="${bw}" height="${base-Y(q)}" rx="2" fill="${on(i)?"var(--acc2)":"var(--acc)"}" fill-opacity="${on(i)?.85:.45}"/>`;
const step=Math.ceil((B.n+1)/12);if(i%step===0||i===B.k)s+=`<text x="${X(i)}" y="${base+13}" font-size="10" text-anchor="middle" fill="${i===B.k?"var(--acc2)":"var(--fg)"}">${i}</text>`;
if(B.n<=8&&q>0.0005)s+=`<text x="${X(i)}" y="${Y(q)-3}" font-size="10" text-anchor="middle" fill="var(--mut)">${f(q,3)}</text>`;});
if($("bnorm").value==="yes"&&B.sd>0){let d="";for(let t=0;t<=120;t++){const x=-0.5+t/120*(B.n+1),v=phi((x-B.mean)/B.sd)/B.sd;d+=`${t?"L":"M"}${(L+(x+0.5)/(B.n+1)*(R-L)).toFixed(1)} ${Y(v).toFixed(1)} `;}s+=`<path d="${d}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="4 3"/>`;}
const mxp=L+(B.mean+0.5)/(B.n+1)*(R-L);s+=`<path d="M${mxp-6} ${base+26} L${mxp+6} ${base+26} L${mxp} ${base+17} Z" fill="var(--acc2)"/><text x="${Math.min(R,Math.max(L,mxp))}" y="14" font-size="11" text-anchor="${mxp>W*0.7?"end":mxp<W*0.3?"start":"middle"}" fill="var(--acc2)">平均 np＝${f(B.mean)}</text></svg>`;
$("bplot").innerHTML=s+`<div class="legend mut"><span><i class="sw" style="background:var(--acc2)"></i>求める範囲</span><span><i class="sw" style="background:var(--acc2)"></i>▲平均</span>${$("bnorm").value==="yes"?`<span><i class="sw" style="border:2px dashed var(--fg)"></i>正規分布（平均 np・分散 np(1−p)）</span>`:""}</div>`;
const lab=B.kind==="eq"?`P(X＝${B.k})`:B.kind==="le"?`P(X≦${B.k})`:`P(X≧${B.k})`;
$("bsum").innerHTML=`<div>P(X＝${B.k})＝${B.n}C${B.k}×${f(B.p)}^${B.k}×${f(1-B.p)}^${B.n-B.k}＝${C(B.n,B.k)}×${f(Math.pow(B.p,B.k)*Math.pow(1-B.p,B.n-B.k),6)}＝<b>${f(B.pk)}</b></div><div>${lab}＝<b>${f(B.sel)}</b>　1回もない＝${f(1-B.p)}^${B.n}＝${f(B.p0)}、少なくとも1回＝${f(B.atleast1)}</div><div>平均 np＝<b>${f(B.mean)}</b>　分散 np(1−p)＝<b>${f(B.var)}</b>　標準偏差＝${f(B.sd)}</div><div class="mut">いちばん起きやすいのは ${B.mode} 回。全部の確率を足すと1。</div>`;
$("btab").innerHTML=B.n<=20?`<table><tr><th>k</th><th>ₙCₖ</th><th>P(X＝k)</th><th>k 以下の合計</th></tr>${B.ps.map((q,i)=>`<tr><td>${i}</td><td>${C(B.n,i)}</td><td>${f(q)}</td><td>${f(B.ps.slice(0,i+1).reduce((a,b)=>a+b,0))}</td></tr>`).join("")}</table>`:`<div class="mut">n が20以下のとき、表を出す。</div>`;}
LK.register("pmf",{name:"二項分布 B(n, p)",
init(){["bn","bp","bk"].forEach(id=>LK.stepper($(id),bRender));$("bkind").onchange=bRender;$("bnorm").onchange=bRender;bRender();},
apply(s){if(s.n!==undefined)LK.setRange("bn",s.n);if(s.p!==undefined)LK.setRange("bp",s.p);$("bk").max=+$("bn").value;if(s.k!==undefined)LK.setRange("bk",s.k);if(s.kind)$("bkind").value=s.kind;if(s.norm)$("bnorm").value=s.norm;bRender();},
render:bRender,
value(key){const B=bVals(),v=B[key];return {v,text:f(v)};}});
function qVals(){const n=+$("qn").value,p=+$("qp").value,k=Math.min(+$("qk").value,n),path=Math.pow(p,k)*Math.pow(1-p,n-k),ncr=C(n,k);return {n,p,k,path,ncr,pk:ncr*path};}
function seqs(n,k){const out=[];const rec=(i,a,c)=>{if(i===n){if(c===k)out.push(a.slice());return;}if(c<k){a.push(1);rec(i+1,a,c+1);a.pop();}if(n-i-1>=k-c){a.push(0);rec(i+1,a,c);a.pop();}};rec(0,[],0);return out;}
function qRender(){fixK("qn","qk");const Q=qVals(),list=seqs(Q.n,Q.k);
$("qplot").innerHTML=`<div class="seqs">${list.map(a=>`<div><span>${a.map(x=>x?"🛒":"❌").join(" ")}</span><span class="pp">${a.map(x=>x?f(Q.p,2):f(1-Q.p,2)).join("×")}</span></div>`).join("")}</div><div class="legend mut"><span>🛒 成功（確率 p）</span><span>❌ 失敗（確率 1−p）</span></div>`;
$("qsum").innerHTML=`<div>並び1つの確率＝${f(Q.p)}^${Q.k}×${f(1-Q.p)}^${Q.n-Q.k}＝<b>${f(Q.path,6)}</b></div><div>並びの数＝${Q.n}C${Q.k}＝<b>${Q.ncr}</b> 通り（どの回が成功かの選び方）</div><div>ちょうど ${Q.k} 回＝${Q.ncr}×${f(Q.path,6)}＝<b>${f(Q.pk)}</b></div><div class="mut">並びどうしは同時に起きない（排反）ので足せる。どの並びも確率が同じなので、足し算が掛け算 ₙCₖ× になる。</div>`;}
LK.register("path",{name:"並びを書き出す",
init(){["qn","qp","qk"].forEach(id=>LK.stepper($(id),qRender));qRender();},
apply(s){if(s.n!==undefined)LK.setRange("qn",s.n);if(s.p!==undefined)LK.setRange("qp",s.p);$("qk").max=+$("qn").value;if(s.k!==undefined)LK.setRange("qk",s.k);qRender();},
render:qRender,
value(key){const Q=qVals(),v=Q[key];return {v,text:key==="ncr"?String(v)+"通り":f(v,6)};}});
function eVals(){const p=+$("ep").value,n=+$("en").value;return {p,n,bmean:p,bvar:p*(1-p),mean:n*p,var:n*p*(1-p),sd:Math.sqrt(n*p*(1-p))};}
function eRender(){const E=eVals(),H=150,L=36,R=W-12,base=H-26,top=14,X=v=>L+v*(R-L),Y=v=>base-v/0.25*(base-top);
let d="";for(let t=0;t<=100;t++){const q=t/100;d+=`${t?"L":"M"}${X(q).toFixed(1)} ${Y(q*(1-q)).toFixed(1)} `;}
let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="p と分散 p(1−p)"><line x1="${L}" y1="${base}" x2="${R}" y2="${base}" stroke="var(--line)"/><line x1="${L}" y1="${top}" x2="${L}" y2="${base}" stroke="var(--line)"/>`;
s+=`<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2.5"/><circle cx="${X(E.p)}" cy="${Y(E.bvar)}" r="5" fill="var(--acc2)"/>`;
s+=`<text x="${L-4}" y="${Y(0.25)+4}" font-size="10" text-anchor="end" fill="var(--mut)">0.25</text><text x="${L}" y="${H-8}" font-size="10" fill="var(--mut)">p＝0</text><text x="${X(0.5)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mut)">0.5</text><text x="${R}" y="${H-8}" font-size="10" text-anchor="end" fill="var(--mut)">1</text>`;
s+=`<text x="${Math.min(R-4,X(E.p)+8)}" y="${Math.max(top+10,Y(E.bvar)-8)}" font-size="11" text-anchor="${E.p>0.6?"end":"start"}" fill="var(--acc2)">p(1−p)＝${f(E.bvar)}</text></svg>`;
$("eplot").innerHTML=s+`<div class="legend mut"><span><i class="sw" style="background:var(--acc)"></i>1回の分散 p(1−p)</span><span><i class="sw" style="background:var(--acc2)"></i>いまの p</span></div>`;
$("esum").innerHTML=`<div>1回（ベルヌーイ）：平均 E(X)＝0×${f(1-E.p)}＋1×${f(E.p)}＝<b>${f(E.bmean)}</b>　分散＝E(X²)−E(X)²＝${f(E.p)}−${f(E.p)}²＝<b>${f(E.bvar)}</b></div><div>${E.n} 回分の合計（二項分布）：平均 np＝<b>${f(E.mean)}</b>　分散 np(1−p)＝<b>${f(E.var)}</b>　標準偏差＝${f(E.sd)}</div><div class="mut">独立な1回分を n 回足すので、平均も分散も n 倍（{{期待値の和・独立なら分散の和}}）。</div>`.replace("{{期待値の和・独立なら分散の和}}","期待値は足せる・独立なら分散も足せる");}
LK.register("bern",{name:"ベルヌーイと np",
init(){["ep","en"].forEach(id=>LK.stepper($(id),eRender));eRender();},
apply(s){if(s.p!==undefined)LK.setRange("ep",s.p);if(s.n!==undefined)LK.setRange("en",s.n);eRender();},
render:eRender,
value(key){const E=eVals(),v=E[key];return {v,text:f(v)};}});
LK.start("pmf");
window.__LAB__={LK,bVals,qVals,eVals,C,pmf};
</script>
