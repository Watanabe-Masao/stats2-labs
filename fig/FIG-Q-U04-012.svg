<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 161" width="360" height="161" font-family="sans-serif"><rect width="360" height="161" rx="10" fill="#fcfcfb"/><text x="8" y="22" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">3人それぞれが5段階のどれかを選ぶ</text><rect x="10" y="45.6" width="64" height="56" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><text x="42" y="67.6" font-size="12.5" fill="#52514e" text-anchor="middle">1人目</text><text x="42" y="89.6" font-size="14" fill="#2a78d6" text-anchor="middle" font-weight="bold">5通り</text><text x="87" y="81.6" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="bold">×</text><rect x="100" y="45.6" width="64" height="56" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><text x="132" y="67.6" font-size="12.5" fill="#52514e" text-anchor="middle">2人目</text><text x="132" y="89.6" font-size="14" fill="#2a78d6" text-anchor="middle" font-weight="bold">5通り</text><text x="177" y="81.6" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="bold">×</text><rect x="190" y="45.6" width="64" height="56" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><text x="222" y="67.6" font-size="12.5" fill="#52514e" text-anchor="middle">3人目</text><text x="222" y="89.6" font-size="14" fill="#2a78d6" text-anchor="middle" font-weight="bold">5通り</text><text x="267" y="81.6" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="bold">＝</text><text x="280" y="81.6" font-size="15" fill="#eb6834" text-anchor="start" font-weight="bold">125通り</text><text x="8" y="121.6" font-size="12.5" fill="#52514e" text-anchor="start">回答した3人は来店客全体（母集団）の標本。満足度は順序</text><text x="8" y="139.7" font-size="12.5" fill="#52514e" text-anchor="start">尺度なので、仮定なしで使える代表値は中央値（と最頻値）。</text></svg>