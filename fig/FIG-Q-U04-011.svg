<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 295" width="360" height="295" font-family="sans-serif"><rect width="360" height="295" rx="10" fill="#ffffff"/><text x="8" y="20" font-size="13.5" fill="#1b1d21" text-anchor="start" font-weight="bold">店番101〜105（①〜⑤）の販売個数</text><line x1="16" y1="196" x2="344" y2="196" stroke="#4b5059" stroke-width="1"/><rect x="29.1" y="115.6" width="39.4" height="80.4" rx="3" fill="#8fb3e3"/><text x="48.8" y="109.6" font-size="12.5" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">12個</text><text x="48.8" y="212" font-size="11.5" fill="#4b5059" text-anchor="middle">①</text><rect x="94.7" y="95.5" width="39.4" height="100.5" rx="3" fill="#8fb3e3"/><text x="114.4" y="89.5" font-size="12.5" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">15個</text><text x="114.4" y="212" font-size="11.5" fill="#4b5059" text-anchor="middle">②</text><rect x="160.3" y="135.7" width="39.4" height="60.3" rx="3" fill="#2a78d6"/><text x="180.0" y="129.7" font-size="12.5" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">9個</text><text x="180" y="212" font-size="11.5" fill="#4b5059" text-anchor="middle">③</text><rect x="225.9" y="62" width="39.4" height="134" rx="3" fill="#2a78d6"/><text x="245.6" y="56.0" font-size="12.5" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">20個</text><text x="245.6" y="212" font-size="11.5" fill="#4b5059" text-anchor="middle">④</text><rect x="291.5" y="102.2" width="39.4" height="93.8" rx="3" fill="#8fb3e3"/><text x="311.2" y="96.2" font-size="12.5" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">14個</text><text x="311.2" y="212" font-size="11.5" fill="#4b5059" text-anchor="middle">⑤</text><line x1="16" y1="102.2" x2="344" y2="102.2" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/><line x1="232" y1="15" x2="256" y2="15" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/><text x="344" y="20" font-size="12.5" fill="#c2410c" text-anchor="end" font-weight="bold">平均 14個</text><text x="8" y="234" font-size="13" fill="#1b1d21" text-anchor="start" font-weight="bold">最大 20個 ÷ 最小 9個 ≒ 2.2倍</text><text x="8" y="254.8" font-size="12.5" fill="#4b5059" text-anchor="start">店番は棒の名前（ラベル）で、量ではない。店番を足して平</text><text x="8" y="273" font-size="12.5" fill="#4b5059" text-anchor="start">均した103は「真ん中の店」でも「標準の店」でもない。</text></svg>