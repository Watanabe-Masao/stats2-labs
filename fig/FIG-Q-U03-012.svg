t="34" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="250" y="109.6" font-size="13.5" fill="#161a1a" text-anchor="middle" font-weight="bold">C・E</text><rect x="289" y="87.6" width="62" height="34" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="320" y="109.6" font-size="13.5" fill="#161a1a" text-anchor="middle" font-weight="bold">D・E</text><text x="8" y="145.6" font-size="13" fill="#161a1a" text-anchor="start">A を含む選び方（色付き）：4通り → 確率 4/10＝2/5</text><text x="8" y="166.4" font-size="12.5" fill="#48504f" text-anchor="start">(b) 選んだ2店の中央値も標本から計算するので統計量。(c)</text><text x="8" y="184.5" font-size="12.5" fill="#48504f" text-anchor="start"> サイコロの標本空間 {1, 2, 3, 4, 5, 6} は、統計の</text><text x="8" y="202.7" font-size="12.5" fill="#48504f" text-anchor="start">「標本」とは別の言葉。</text></svg>