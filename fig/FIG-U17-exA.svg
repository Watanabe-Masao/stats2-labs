<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" width="360" height="362" font-family="sans-serif"><rect width="360" height="362" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="183" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="73.14999999999999" width="308" height="105" rx="10" fill="#fdf0e9" stroke="#c2410c" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：地域の全105店</text><text x="22" y="50.3" font-size="13" fill="#4b5059" text-anchor="start">N＝105（知りたい範囲）</text><text x="38" y="95.1" font-size="14" fill="#c2410c" text-anchor="start" font-weight="bold">標本：台帳の100店から選んだ10店</text><text x="38" y="115.4" font-size="13" fill="#4b5059" text-anchor="start">台帳の各店が選ばれる確率 10÷100＝0.1</text><text x="38" y="136.3" font-size="12.5" fill="#cf222e" text-anchor="start">⚠ 台帳に載らない新店5店は選ばれない（確率0）。</text><text x="38" y="154.4" font-size="12.5" fill="#cf222e" text-anchor="start">結論を言えるのは台帳の100店まで</text><rect x="8" y="199.5" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="214.5" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="234.1" font-size="12" fill="#4b5059" text-anchor="start">決まっているが、ふつうは分からない</text><text x="28" y="253.5" font-size="13" fill="#1b1d21" text-anchor="start">・全105店の本当の満足度の平均（分からない）</text><rect x="8" y="271.4" width="5" height="18" rx="2" fill="#c2410c"/><text x="20" y="286.4" font-size="13.5" fill="#c2410c" text-anchor="start" font-weight="bold">統計量（標本から計算した値）</text><text x="20" y="305.9" font-size="12" fill="#4b5059" text-anchor="start">標本を取り直すと変わる</text><text x="28" y="325.3" font-size="13" fill="#1b1d21" text-anchor="start">・選んだ10店の満足度の平均（選び方で変わる）</text></svg>