<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" width="360" height="362" font-family="sans-serif"><style>@media (prefers-color-scheme: dark){[fill="#ffffff" i]{fill:#161919}[stroke="#ffffff" i]{stroke:#161919}[fill="#161a1a" i]{fill:#e6e9e8}[stroke="#161a1a" i]{stroke:#e6e9e8}[fill="#48504f" i]{fill:#a6adab}[stroke="#48504f" i]{stroke:#a6adab}[fill="#68706f" i]{fill:#7e8684}[stroke="#68706f" i]{stroke:#7e8684}[fill="#e0e4e3" i]{fill:#252a2a}[stroke="#e0e4e3" i]{stroke:#252a2a}[fill="#2a78d6" i]{fill:#3987e5}[stroke="#2a78d6" i]{stroke:#3987e5}[fill="#b86e00" i]{fill:#c98500}[stroke="#b86e00" i]{stroke:#c98500}[fill="#6250d6" i]{fill:#9085e9}[stroke="#6250d6" i]{stroke:#9085e9}[fill="#c2416f" i]{fill:#d55181}[stroke="#c2416f" i]{stroke:#d55181}[fill="#c53b3b" i]{fill:#e66767}[stroke="#c53b3b" i]{stroke:#e66767}[fill="#9dbfe8" i]{fill:#2b4566}[stroke="#9dbfe8" i]{stroke:#2b4566}[fill="#eaf1fb" i]{fill:#172231}[stroke="#eaf1fb" i]{stroke:#172231}[fill="#fbf1e3" i]{fill:#2e2412}[stroke="#fbf1e3" i]{stroke:#2e2412}}</style><rect width="360" height="362" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="183" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="73.14999999999999" width="308" height="105" rx="10" fill="#fbf1e3" stroke="#b86e00" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：地域の全105店</text><text x="22" y="50.3" font-size="13" fill="#48504f" text-anchor="start">N＝105（知りたい範囲）</text><text x="38" y="95.1" font-size="14" fill="#b86e00" text-anchor="start" font-weight="bold">標本：台帳の100店から選んだ10店</text><text x="38" y="115.4" font-size="13" fill="#48504f" text-anchor="start">台帳の各店が選ばれる確率 10÷100＝0.1</text><text x="38" y="136.3" font-size="12.5" fill="#c53b3b" text-anchor="start">⚠ 台帳に載らない新店5店は選ばれない（確率0）。</text><text x="38" y="154.4" font-size="12.5" fill="#c53b3b" text-anchor="start">結論を言えるのは台帳の100店まで</text><rect x="8" y="199.5" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="214.5" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="234.1" font-size="12" fill="#48504f" text-anchor="start">決まっているが、ふつうは分からない</text><text x="28" y="253.5" font-size="13" fill="#161a1a" text-anchor="start">・全105店の本当の満足度の平均（分からない）</text><rect x="8" y="271.4" width="5" height="18" rx="2" fill="#b86e00"/><text x="20" y="286.4" font-size="13.5" fill="#b86e00" text-anchor="start" font-weight="bold">統計量（標本から計算した値）</text><text x="20" y="305.9" font-size="12" fill="#48504f" text-anchor="start">標本を取り直すと変わる</text><text x="28" y="325.3" font-size="13" fill="#161a1a" text-anchor="start">・選んだ10店の満足度の平均（選び方で変わる）</text></svg>