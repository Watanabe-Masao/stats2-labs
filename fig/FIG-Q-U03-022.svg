<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 305" width="360" height="305" font-family="sans-serif"><rect width="360" height="305" rx="10" fill="#fcfcfb"/><rect x="8" y="8" width="344" height="125" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="54.3" width="308" height="67" rx="10" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：会員100万人</text><text x="38" y="76.3" font-size="14" fill="#eb6834" text-anchor="start" font-weight="bold">標本：無作為に選んだ2,000人</text><text x="38" y="96.6" font-size="13" fill="#52514e" text-anchor="start">n＝2,000</text><rect x="8" y="142.4" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="157.4" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="177" font-size="12" fill="#52514e" text-anchor="start">決まっているが、ふつうは分からない</text><text x="28" y="196.4" font-size="13" fill="#0b0b0b" text-anchor="start">・会員全体の「満足」の割合（分からない）</text><rect x="8" y="214.3" width="5" height="18" rx="2" fill="#eb6834"/><text x="20" y="229.3" font-size="13.5" fill="#eb6834" text-anchor="start" font-weight="bold">統計量（標本から計算した値）</text><text x="20" y="248.8" font-size="12" fill="#52514e" text-anchor="start">標本を取り直すと変わる</text><text x="28" y="268.2" font-size="13" fill="#0b0b0b" text-anchor="start">・「満足」と答えた割合 62%</text></svg>