d"/><circle cx="30" cy="155.1" r="4" fill="#9085e9"/><text x="30.0" y="146.1" font-size="12" fill="#e6e9e8" text-anchor="middle" font-weight="bold" stroke="#161919" stroke-width="4" paint-order="stroke">100</text><circle cx="180" cy="171.6" r="4" fill="#9085e9"/><text x="180.0" y="162.6" font-size="12" fill="#e6e9e8" text-anchor="middle" font-weight="bold" stroke="#161919" stroke-width="4" paint-order="stroke">90</text><circle cx="330" cy="186.5" r="4" fill="#9085e9"/><text x="330.0" y="177.5" font-size="12" fill="#e6e9e8" text-anchor="middle" font-weight="bold" stroke="#161919" stroke-width="4" paint-order="stroke">81</text><text x="30" y="219.6" font-size="11.5" fill="#a6adab" text-anchor="middle">基準</text><text x="180" y="219.6" font-size="11.5" fill="#a6adab" text-anchor="middle">1期後</text><text x="330" y="219.6" font-size="11.5" fill="#a6adab" text-anchor="middle">2期後</text><line x1="10" y1="231.6" x2="30" y2="231.6" stroke="#3987e5" stroke-width="2.5"/><text x="36" y="235.6" font-size="12" fill="#a6adab" text-anchor="start">実際の値</text><line x1="10" y1="249" x2="30" y2="249" stroke="#c98500" stroke-width="2.5"/><text x="36" y="253" font-size="12" fill="#a6adab" text-anchor="start">率を足して2で割った＋2%で増やした線</text><line x1="10" y1="266.4" x2="30" y2="266.4" stroke="#9085e9" stroke-width="2.5" stroke-dasharray="6 4"/><text x="36" y="270.4" font-size="12" fill="#a6adab" text-anchor="start">毎期 0.9倍（−10%）の線（倍率の幾何平均）</text><text x="8" y="291.8" font-size="12.5" fill="#a6adab" text-anchor="start">＋50%・−46% の平均は＋2%に見えるが、実際は81に減った。</text><text x="8" y="309.9" font-size="12.5" fill="#a6adab" text-anchor="start">毎期 0.9倍（−10%）なら、2回で81に届く。</text></svg>