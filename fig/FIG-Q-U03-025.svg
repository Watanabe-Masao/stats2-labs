<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 178" width="360" height="178" font-family="sans-serif"><rect width="360" height="178" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="107" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="54.3" width="308" height="48" rx="10" fill="#fbf1e3" stroke="#b86e00" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：全国の世帯</text><text x="38" y="76.3" font-size="14" fill="#b86e00" text-anchor="start" font-weight="bold">標本：家計調査で選んだ世帯</text><text x="8" y="138.6" font-size="12.5" fill="#48504f" text-anchor="start">回答の誤りや無回答による誤差（非標本誤差）は、標本調査</text><text x="8" y="156.7" font-size="12.5" fill="#48504f" text-anchor="start">でも全数調査でも起こる</text></svg>