<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 449" width="360" height="449" font-family="sans-serif" role="img" aria-label="散布図（5点）。相関係数 1"><rect width="360" height="449" rx="10" fill="#161919"/><text x="8" y="22" font-size="13.5" fill="#e6e9e8" text-anchor="start" font-weight="bold">2つの量が一緒に動く分は、偏差の積の平均（共分散）</text><text x="8" y="41.6" font-size="13.5" fill="#e6e9e8" text-anchor="start" font-weight="bold">で測る</text><line x1="40" y1="271.1" x2="346" y2="271.1" stroke="#252a2a" stroke-width="1"/><text x="34" y="275.1" font-size="11" fill="#a6adab" text-anchor="end">18</text><line x1="40" y1="178.1" x2="346" y2="178.1" stroke="#252a2a" stroke-width="1"/><text x="34" y="182.1" font-size="11" fill="#a6adab" text-anchor="end">20</text><line x1="40" y1="85.2" x2="346" y2="85.2" stroke="#252a2a" stroke-width="1"/><text x="34" y="89.2" font-size="11" fill="#a6adab" text-anchor="end">22</text><text x="52" y="298.1" font-size="11" fill="#a6adab" text-anchor="middle">8</text><text x="193" y="298.1" font-size="11" fill="#a6adab" text-anchor="middle">10</text><text x="334" y="298.1" font-size="11" fill="#a6adab" text-anchor="middle">12</text><line x1="40" y1="283.1" x2="346" y2="283.1" stroke="#a6adab" stroke-width="1"/><rect x="52" y="178.1" width="141" height="93" fill="#c98500" stroke="#c98500" fill-opacity="0.18" stroke-width="1"/><rect x="122.5" y="178.1" width="70.5" height="46.5" fill="#c98500" stroke="#c98500" fill-opacity="0.18" stroke-width="1"/><rect x="193" y="131.7" width="70.5" height="46.5" fill="#c98500" stroke="#c98500" fill-opacity="0.18" stroke-width="1"/><rect x="193" y="85.2" width="141" height="93" fill="#c98500" stroke="#c98500" fill-opacity="0.18" stroke-width="1"/><line x1="193" y1="73.2" x2="193" y2="283.1" stroke="#a6adab" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="40" y1="178.1" x2="346" y2="178.1" stroke="#a6adab" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="52" cy="271.1" r="4.5" fill="#e6e9e8"/><circle cx="122.5" cy="224.6" r="4.5" fill="#e6e9e8"/><circle cx="193" cy="178.1" r="4.5" fill="#e6e9e8"/><circle cx="263.5" cy="131.7" r="4.5" fill="#e6e9e8"/><circle cx="334" cy="85.2" r="4.5" fill="#e6e9e8"/><text x="346" y="317.1" font-size="11.5" fill="#a6adab" text-anchor="end">売場A（個）</text><text x="40" y="69.2" font-size="11.5" fill="#a6adab" text-anchor="start">売場C（個）</text><text x="8" y="337.1" font-size="12.5" fill="#e6e9e8" text-anchor="start">平均の点（10, 20）・偏差の積の平均（共分散）2</text><text x="8" y="365.3" font-size="12.5" fill="#e6e9e8" text-anchor="start">右上・左下の長方形は偏差の積が正（同じ向き）、左上・右</text><text x="8" y="383.4" font-size="12.5" fill="#e6e9e8" text-anchor="start">下は負（逆の向き）</text><text x="8" y="407.5" font-size="12.5" fill="#a6adab" text-anchor="start">売場A を A 自身と組にすると、偏差の積の平均は A の分散</text><text x="8" y="425.6" font-size="12.5" fill="#a6adab" text-anchor="start">になる</text></svg>