<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 249" width="360" height="249" font-family="sans-serif"><rect width="360" height="249" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="105" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="54.3" width="308" height="47" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：先月の全店・全取引</text><text x="38" y="76.3" font-size="13" fill="#2a78d6" text-anchor="start" font-weight="bold">全数調査：知りたい全体を全部調べた</text><rect x="8" y="122.1" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="137.1" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="156.7" font-size="12" fill="#4b5059" text-anchor="start">全部を使って計算したので、推し量る必要がない</text><text x="28" y="176.1" font-size="13" fill="#1b1d21" text-anchor="start">・先月の全取引の平均客単価</text><text x="8" y="209" font-size="12.5" fill="#4b5059" text-anchor="start">知りたいのが「来月の客単価」なら、先月のデータは推測の</text><text x="8" y="227.1" font-size="12.5" fill="#4b5059" text-anchor="start">材料（標本のような役割）になる。</text></svg>