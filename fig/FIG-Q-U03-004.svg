<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 249" width="360" height="249" font-family="sans-serif"><style>@media (prefers-color-scheme: dark){[fill="#ffffff" i]{fill:#161919}[stroke="#ffffff" i]{stroke:#161919}[fill="#161a1a" i]{fill:#e6e9e8}[stroke="#161a1a" i]{stroke:#e6e9e8}[fill="#48504f" i]{fill:#a6adab}[stroke="#48504f" i]{stroke:#a6adab}[fill="#68706f" i]{fill:#7e8684}[stroke="#68706f" i]{stroke:#7e8684}[fill="#e0e4e3" i]{fill:#252a2a}[stroke="#e0e4e3" i]{stroke:#252a2a}[fill="#2a78d6" i]{fill:#3987e5}[stroke="#2a78d6" i]{stroke:#3987e5}[fill="#b86e00" i]{fill:#c98500}[stroke="#b86e00" i]{stroke:#c98500}[fill="#6250d6" i]{fill:#9085e9}[stroke="#6250d6" i]{stroke:#9085e9}[fill="#c2416f" i]{fill:#d55181}[stroke="#c2416f" i]{stroke:#d55181}[fill="#c53b3b" i]{fill:#e66767}[stroke="#c53b3b" i]{stroke:#e66767}[fill="#9dbfe8" i]{fill:#2b4566}[stroke="#9dbfe8" i]{stroke:#2b4566}[fill="#eaf1fb" i]{fill:#172231}[stroke="#eaf1fb" i]{stroke:#172231}[fill="#fbf1e3" i]{fill:#2e2412}[stroke="#fbf1e3" i]{stroke:#2e2412}}</style><rect width="360" height="249" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="105" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="54.3" width="308" height="47" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：先月の全店・全取引</text><text x="38" y="76.3" font-size="13" fill="#2a78d6" text-anchor="start" font-weight="bold">全数調査：知りたい全体を全部調べた</text><rect x="8" y="122.1" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="137.1" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="156.7" font-size="12" fill="#48504f" text-anchor="start">全部を使って計算したので、推し量る必要がない</text><text x="28" y="176.1" font-size="13" fill="#161a1a" text-anchor="start">・先月の全取引の平均客単価</text><text x="8" y="209" font-size="12.5" fill="#48504f" text-anchor="star