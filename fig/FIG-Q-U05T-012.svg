<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" width="360" height="276" font-family="sans-serif"><rect width="360" height="276" rx="10" fill="#ffffff"/><text x="8" y="20" font-size="13.5" fill="#1b1d21" text-anchor="start" font-weight="bold">会員の割合（200人を調べた結果）</text><line x1="16" y1="196" x2="344" y2="196" stroke="#4b5059" stroke-width="1"/><rect x="76" y="84.3" width="44" height="111.7" rx="3" fill="#8fb3e3"/><text x="98.0" y="78.3" font-size="12.5" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">10%</text><text x="98" y="212" font-size="11.5" fill="#4b5059" text-anchor="middle">去年</text><rect x="240" y="62" width="44" height="134" rx="3" fill="#8fb3e3"/><text x="262.0" y="56.0" font-size="12.5" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">12%</text><text x="262" y="212" font-size="11.5" fill="#4b5059" text-anchor="middle">今年</text><text x="8" y="236" font-size="12.5" fill="#4b5059" text-anchor="start">割合どうしの差は「2ポイント増」、去年の割合を基準にす</text><text x="8" y="254.1" font-size="12.5" fill="#4b5059" text-anchor="start">ると「20%増」。どちらで言ったかを書く。</text></svg>