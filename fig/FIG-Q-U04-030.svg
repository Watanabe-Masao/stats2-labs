<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 295" width="360" height="295" font-family="sans-serif"><rect width="360" height="295" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="44" rx="8" fill="#fbf1e3" stroke="#b86e00" stroke-width="1.5"/><text x="16" y="28" font-size="14" fill="#b86e00" text-anchor="start" font-weight="bold">名義</text><text x="16" y="45" font-size="11" fill="#48504f" text-anchor="start">＝ ≠ だけ</text><text x="94" y="35" font-size="11.5" fill="#68706f" text-anchor="start">（この段のデータはない）</text><rect x="8" y="58" width="344" height="57" rx="8" fill="#fbf1e3" stroke="#b86e00" stroke-width="1.5"/><text x="16" y="78" font-size="14" fill="#b86e00" text-anchor="start" font-weight="bold">順序</text><text x="16" y="95" font-size="11" fill="#48504f" text-anchor="start">＜ ＞ まで</text><rect x="90" y="64" width="227.8" height="45" rx="6" fill="#ffffff" stroke="#b86e00" stroke-width="1.5"/><text x="98" y="82" font-size="13" fill="#161a1a" text-anchor="start" font-weight="bold">痛みの強さ（0〜10）</text><text x="98" y="98" font-size="12" fill="#48504f" text-anchor="start">6→3は「3段階下がった」。「半分」✕</text><rect x="8" y="121" width="344" height="44" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><text x="16" y="141" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">間隔</text><text x="16" y="158" font-size="11" fill="#48504f" text-anchor="start">＋ − まで</text><text x="94" y="148" font-size="11.5" fill="#68706f" text-anchor="start">（この段のデータはない）</text><rect x="8" y="171" width="344" height="44" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><text x="16" y="191" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">比例</text><text x="16" y="208" font-size="11" fill="#48504f" text-anchor="start">× ÷ まで</text><text x="94" y="198" font-size="11.5" fill="#68706f" text-anchor="start">（この段のデータはない）</text><rect x="8" y="225" width="10" height="10" rx="2" fill="#b86e00"/><text x="24" y="234" font-size="12" fill="#48504f" text-anchor="start">質的変数（名義・順序）</text><rect x="184" y="225" width="10" height="10" rx="2" fill="#2a78d6"/><text x="200" y="234" font-size="12" fill="#48504f" text-anchor="start">量的変数（間隔・比例）</text><text x="8" y="255" font-size="12.5" fill="#48504f" text-anchor="start">0に「無い」の意味があっても、段階の間隔がそろっていな</text><text x="8" y="273.1" font-size="12.5" fill="#48504f" text-anchor="start">ければ「半分」のような比は言えない。</text></svg>