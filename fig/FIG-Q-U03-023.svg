<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 325" width="360" height="325" font-family="sans-serif"><rect width="360" height="325" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="125" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="54.3" width="308" height="67" rx="10" fill="#fdf0e9" stroke="#c2410c" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：母集団</text><text x="38" y="76.3" font-size="14" fill="#c2410c" text-anchor="start" font-weight="bold">標本：調べたデータ</text><text x="38" y="96.6" font-size="13" fill="#4b5059" text-anchor="start">n＝25（標本の大きさ）</text><rect x="8" y="142.4" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="157.4" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="177" font-size="12" fill="#4b5059" text-anchor="start">ギリシャ文字は母数の側。データから計算した値ではない</text><text x="28" y="196.4" font-size="13" fill="#1b1d21" text-anchor="start">・μ₀＝3.0（帰無仮説で仮に置いた母平均）</text><rect x="8" y="214.3" width="5" height="18" rx="2" fill="#c2410c"/><text x="20" y="229.3" font-size="13.5" fill="#c2410c" text-anchor="start" font-weight="bold">統計量（標本から計算した値）</text><text x="20" y="248.8" font-size="12" fill="#4b5059" text-anchor="start">標本を取り直すと変わる</text><text x="28" y="268.2" font-size="13" fill="#1b1d21" text-anchor="start">・x̄＝3.2（標本平均）</text><text x="28" y="289.1" font-size="13" fill="#1b1d21" text-anchor="start">・s＝1.1（標本の標準偏差）</text></svg>