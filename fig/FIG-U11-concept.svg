<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" width="360" height="276" font-family="sans-serif"><rect width="360" height="276" rx="10" fill="#ffffff"/><text x="12" y="18" font-size="12.5" fill="#48504f" text-anchor="start">赤 2 個・青 3 個の袋から戻さずに2回引く</text><line x1="12" y1="140" x2="92" y2="80" stroke="#2a78d6" stroke-width="3"/><text x="44" y="104" font-size="12" fill="#161a1a" text-anchor="start">2/5</text><text x="98" y="84" font-size="13" fill="#161a1a" text-anchor="start" font-weight="bold">赤</text><line x1="114" y1="80" x2="168" y2="50" stroke="#2a78d6" stroke-width="3"/><text x="137" y="60" font-size="11.5" fill="#48504f" text-anchor="start">1/4</text><text x="174" y="47" font-size="11.5" fill="#161a1a" text-anchor="start" font-weight="bold">赤→赤</text><text x="174" y="62" font-size="11.5" fill="#161a1a" text-anchor="start" font-weight="bold">2/5×1/4＝1/10</text><line x1="114" y1="80" x2="168" y2="110" stroke="#e0e4e3" stroke-width="1.5"/><text x="137" y="90" font-size="11.5" fill="#48504f" text-anchor="start">3/4</text><text x="174" y="107" font-size="11.5" fill="#161a1a" text-anchor="start" font-weight="normal">赤→青</text><line x1="12" y1="140" x2="92" y2="200" stroke="#e0e4e3" stroke-width="1.5"/><text x="44" y="164" font-size="12" fill="#161a1a" text-anchor="start">3/5</text><text x="98" y="204" font-size="13" fill="#161a1a" text-anchor="start" font-weight="bold">青</text><line x1="114" y1="200" x2="168" y2="170" stroke="#e0e4e3" stroke-width="1.5"/><text x="137" y="180" font-size="11.5" fill="#48504f" text-anchor="start">2/4</text><text x="174" y="167" font-size="11.5" fill="#161a1a" text-anchor="start" font-weight="normal">青→赤</text><line x1="114" y1="200" x2="168" y2="230" stroke="#e0e4e3" stroke-width="1.5"/><text x="137" y="210" font-size="11.5" fill="#48504f" text-anchor="start">2/4</text><text x="174" y="227" font-size="11.5" fill="#161a1a" text-anchor="start" font-weight="normal">青→青</text><text x="12" y="262" font-size="12" fill="#48504f" text-anchor="start">2回目の枝の確率は、1回目の結果で変わる（条件付き確率）</text></svg>