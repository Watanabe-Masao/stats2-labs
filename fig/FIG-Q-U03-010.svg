<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 343" width="360" height="343" font-family="sans-serif"><rect width="360" height="343" rx="10" fill="#fcfcfb"/><rect x="8" y="8" width="344" height="164" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="54.3" width="308" height="105" rx="10" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：全来店客</text><text x="38" y="76.3" font-size="14" fill="#eb6834" text-anchor="start" font-weight="bold">標本：ある日の午前中に来た客120人</text><text x="38" y="96.6" font-size="13" fill="#52514e" text-anchor="start">n＝120</text><text x="38" y="117.4" font-size="12.5" fill="#e34948" text-anchor="start">⚠ 午前中の客だけ。午後や休日の客と違うかもし</text><text x="38" y="135.6" font-size="12.5" fill="#e34948" text-anchor="start">れない</text><rect x="8" y="180.7" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="195.7" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="215.3" font-size="12" fill="#52514e" text-anchor="start">決まっているが、ふつうは分からない</text><text x="28" y="234.7" font-size="13" fill="#0b0b0b" text-anchor="start">・全来店客の満足の割合 p</text><rect x="8" y="252.5" width="5" height="18" rx="2" fill="#eb6834"/><text x="20" y="267.5" font-size="13.5" fill="#eb6834" text-anchor="start" font-weight="bold">統計量（標本から計算した値）</text><text x="20" y="287.1" font-size="12" fill="#52514e" text-anchor="start">標本を取り直すと変わる</text><text x="28" y="306.5" font-size="13" fill="#0b0b0b" text-anchor="start">・満足と答えた割合 p̂＝75%</text></svg>