<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" width="360" height="324" font-family="sans-serif"><rect width="360" height="324" rx="10" fill="#161919"/><rect x="8" y="8" width="344" height="252" rx="12" fill="#172231" stroke="#3987e5" stroke-width="1.5"/><text x="22" y="32" font-size="14" fill="#3987e5" text-anchor="start" font-weight="bold">母集団：地域の全店（105店）</text><text x="22" y="52" font-size="12" fill="#a6adab" text-anchor="start">結論を広げたい範囲</text><rect x="22" y="66" width="230" height="180" rx="10" fill="#161919" stroke="#a6adab" stroke-width="1.5" stroke-dasharray="6 4"/><text x="34" y="88" font-size="13.5" fill="#e6e9e8" text-anchor="start" font-weight="bold">抽出枠：店舗台帳（100店）</text><text x="34" y="106" font-size="12" fill="#a6adab" text-anchor="start">どの要素も選ばれる確率 10÷100＝0.1</text><circle cx="137" cy="176" r="54" fill="#2e2412" stroke="#c98500" stroke-width="1.8"/><text x="137" y="172" font-size="13" fill="#c98500" text-anchor="middle" font-weight="bold">標本：選んだ店</text><text x="137" y="192" font-size="12.5" fill="#c98500" text-anchor="middle">（10店）</text><text x="304" y="140" font-size="13" fill="#e66767" text-anchor="middle" font-weight="bold">枠の外</text><text x="304" y="160" font-size="14" fill="#e66767" text-anchor="middle" font-weight="bold">5店</text><text x="304" y="180" font-size="11.5" fill="#e66767" text-anchor="middle">選ばれる確率 0</text><text x="8" y="284" font-size="12.5" fill="#a6adab" text-anchor="start">結論を言えるのは抽出枠の100店まで。</text><text x="8" y="302.1" font-size="12.5" fill="#a6adab" text-anchor="start">枠の外の5店は、標本を大きくしても入らない</text></svg>