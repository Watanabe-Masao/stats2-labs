<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 431" width="360" height="431" font-family="sans-serif"><rect width="360" height="431" rx="10" fill="#ffffff"/><text x="8" y="22" font-size="13.5" fill="#161a1a" text-anchor="start" font-weight="bold">2つの量が一緒に動く分は、偏差の積の平均（共分散）</text><text x="8" y="41.6" font-size="13.5" fill="#161a1a" text-anchor="start" font-weight="bold">で測る</text><line x1="40" y1="271.1" x2="346" y2="271.1" stroke="#e0e4e3" stroke-width="1"/><text x="34" y="275.1" font-size="11" fill="#48504f" text-anchor="end">18</text><line x1="40" y1="178.1" x2="346" y2="178.1" stroke="#e0e4e3" stroke-width="1"/><text x="34" y="182.1" font-size="11" fill="#48504f" text-anchor="end">20</text><line x1="40" y1="85.2" x2="346" y2="85.2" stroke="#e0e4e3" stroke-width="1"/><text x="34" y="89.2" font-size="11" fill="#48504f" text-anchor="end">22</text><text x="52" y="298.1" font-size="11" fill="#48504f" text-anchor="middle">8</text><text x="193" y="298.1" font-size="11" fill="#48504f" text-anchor="middle">10</text><text x="334" y="298.1" font-size="11" fill="#48504f" text-anchor="middle">12</text><line x1="40" y1="283.1" x2="346" y2="283.1" stroke="#48504f" stroke-width="1"/><rect x="52.0" y="178.1" width="141.0" height="93.0" fill="#2a78d6" fill-opacity="0.18" stroke="#2a78d6" stroke-width="1"/><rect x="122.5" y="178.1" width="70.5" height="46.5" fill="#2a78d6" fill-opacity="0.18" stroke="#2a78d6" stroke-width="1"/><rect x="193.0" y="131.7" width="70.5" height="46.5" fill="#2a78d6" fill-opacity="0.18" stroke="#2a78d6" stroke-width="1"/><rect x="193.0" y="85.2" width="141.0" height="93.0" fill="#2a78d6" fill-opacity="0.18" stroke="#2a78d6" stroke-width="1"/><line x1="193" y1="73.2" x2="193" y2="283.1" stroke="#48504f" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="40" y1="178.1" x2="346" y2="178.1" stroke="#48504f" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="52" cy="271.1" r="4.5" fill="#161a1a"/><circle cx="122.5" cy="224.6" r="4.5" fill="#161a1a"/><circle cx="193" cy="178.1" r="4.5" fill="#161a1a"/><circle cx="263.5" cy="131.7" r="4.5" fill="#161a1a"/><circle cx="334" cy="85.2" r="4.5" fill="#161a1a"/><text x="346" y="317.1" font-size="11.5" fill="#48504f" text-anchor="end">売場A（個）</text><text x="40" y="69.2" font-size="11.5" fill="#48504f" text-anchor="start">売場C（個）</text><text x="8" y="337.1" font-size="12.5" fill="#161a1a" text-anchor="start">平均の点（10, 20）・偏差の積の平均（共分散）2</text><text x="8" y="365.3" font-size="12.5" fill="#161a1a" text-anchor="start">青の長方形は同じ向き（偏差の積が正）、橙は逆の向き（負）</text><text x="8" y="389.4" font-size="12.5" fill="#48504f" text-anchor="start">売場A を A 自身と組にすると、偏差の積の平均は A の分散</text><text x="8" y="407.5" font-size="12.5" fill="#48504f" text-anchor="start">になる</text></svg>