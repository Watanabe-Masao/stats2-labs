<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 279" width="360" height="279" font-family="sans-serif"><rect width="360" height="279" rx="10" fill="#ffffff"/><text x="8" y="22" font-size="13.5" fill="#1b1d21" text-anchor="start" font-weight="bold">係数 (N−n)/(N−1)：N＝1,000 のとき</text><line x1="44" y1="191.6" x2="344" y2="191.6" stroke="#e3e5e8" stroke-width="1"/><text x="38" y="195.6" font-size="11.5" fill="#4b5059" text-anchor="end">0</text><line x1="44" y1="119.6" x2="344" y2="119.6" stroke="#e3e5e8" stroke-width="1"/><text x="38" y="123.6" font-size="11.5" fill="#4b5059" text-anchor="end">0.5</text><line x1="44" y1="47.6" x2="344" y2="47.6" stroke="#e3e5e8" stroke-width="1"/><text x="38" y="51.6" font-size="11.5" fill="#4b5059" text-anchor="end">1</text><text x="44" y="207.6" font-size="11.5" fill="#4b5059" text-anchor="middle">0</text><text x="194" y="207.6" font-size="11.5" fill="#4b5059" text-anchor="middle">500</text><text x="344" y="207.6" font-size="11.5" fill="#4b5059" text-anchor="end">1,000</text><text x="344" y="223.6" font-size="11.5" fill="#4b5059" text-anchor="end">選ぶ数 n</text><polyline points="44,47.6 344,191.6" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/><line x1="44" y1="47.6" x2="344" y2="47.6" stroke="#4b5059" stroke-width="1" stroke-dasharray="4 3"/><text x="344" y="41.6" font-size="11.5" fill="#4b5059" text-anchor="end">戻して選ぶ＝1（修正なし）</text><circle cx="74" cy="61.8" r="5" fill="#c2410c" stroke="#ffffff" stroke-width="2"/><text x="83" y="79.8" font-size="13" fill="#c2410c" text-anchor="start" font-weight="bold">n＝100：0.901</text><text x="8" y="239.6" font-size="12.5" fill="#4b5059" text-anchor="start">分散は約0.90倍、標準偏差は √0.901≒0.95倍。n が N に</text><text x="8" y="257.7" font-size="12.5" fill="#4b5059" text-anchor="start">近づくほど係数は0に近づく。</text></svg>