e" text-anchor="start">四分位数は中央値の仲間。中央値と同じく、端の値の大きさ</text><text x="8" y="178.4" font-size="12.5" fill="#52514e" text-anchor="start">に影響されにくい。平均（▲）は17に引っ張られて箱の右端</text><text x="8" y="196.5" font-size="12.5" fill="#52514e" text-anchor="start">に来る。</text></svg>