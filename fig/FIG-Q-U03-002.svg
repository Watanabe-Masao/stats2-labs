<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 325" width="360" height="325" font-family="sans-serif"><rect width="360" height="325" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="125" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="54.3" width="308" height="67" rx="10" fill="#fbf1e3" stroke="#b86e00" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：全社員</text><text x="38" y="76.3" font-size="14" fill="#b86e00" text-anchor="start" font-weight="bold">標本：調べた30人</text><text x="38" y="96.6" font-size="13" fill="#48504f" text-anchor="start">n＝30</text><rect x="8" y="142.4" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="157.4" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="177" font-size="12" fill="#48504f" text-anchor="start">決まっているが、ふつうは分からない</text><text x="28" y="196.4" font-size="13" fill="#161a1a" text-anchor="start">・② 全社員の本当の平均年齢</text><rect x="8" y="214.3" width="5" height="18" rx="2" fill="#b86e00"/><text x="20" y="229.3" font-size="13.5" fill="#b86e00" text-anchor="start" font-weight="bold">統計量（標本から計算した値）</text><text x="20" y="248.8" font-size="12" fill="#48504f" text-anchor="start">標本を取り直すと変わる</text><text x="28" y="268.2" font-size="13" fill="#161a1a" text-anchor="start">・① 30人の平均年齢</text><text x="28" y="289.1" font-size="13" fill="#161a1a" text-anchor="start">・③ 30人の年齢の標準偏差</text></svg>