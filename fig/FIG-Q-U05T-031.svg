<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 299" width="360" height="299" font-family="sans-serif"><rect width="360" height="299" rx="10" fill="#ffffff"/><text x="8" y="22" font-size="13.5" fill="#1b1d21" text-anchor="start" font-weight="bold">物価指数（基準年＝100）</text><line x1="16" y1="203.6" x2="344" y2="203.6" stroke="#4b5059" stroke-width="1"/><polyline points="30,117.8 180,96.3 330,74.9" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/><circle cx="30" cy="117.8" r="4" fill="#2a78d6"/><text x="30.0" y="108.8" font-size="12" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">100</text><circle cx="180" cy="96.3" r="4" fill="#2a78d6"/><text x="180.0" y="87.3" font-size="12" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">125</text><circle cx="330" cy="74.9" r="4" fill="#2a78d6"/><text x="330.0" y="65.9" font-size="12" fill="#1b1d21" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">150</text><text x="30" y="219.6" font-size="11.5" fill="#4b5059" text-anchor="middle">基準年</text><text x="180" y="219.6" font-size="11.5" fill="#4b5059" text-anchor="middle">前年</text><text x="330" y="219.6" font-size="11.5" fill="#4b5059" text-anchor="middle">今年</text><line x1="10" y1="231.6" x2="30" y2="231.6" stroke="#2a78d6" stroke-width="2.5"/><text x="36" y="235.6" font-size="12" fill="#4b5059" text-anchor="start">物価指数</text><text x="8" y="257" font-size="12.5" fill="#4b5059" text-anchor="start">ポイントは指数どうしの差、上昇率は前年の指数を分母にし</text><text x="8" y="275.1" font-size="12.5" fill="#4b5059" text-anchor="start">た割合。</text></svg>