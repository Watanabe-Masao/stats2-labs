<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 343" width="360" height="343" font-family="sans-serif"><rect width="360" height="343" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="164" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="54.3" width="308" height="105" rx="10" fill="#fdf0e9" stroke="#c2410c" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：全従業員</text><text x="38" y="76.3" font-size="14" fill="#c2410c" text-anchor="start" font-weight="bold">標本：自分から回答した20人</text><text x="38" y="96.6" font-size="13" fill="#4b5059" text-anchor="start">n＝20</text><text x="38" y="117.4" font-size="12.5" fill="#cf222e" text-anchor="start">⚠ 自分から回答した人だけ。残業の多い（少ない）</text><text x="38" y="135.6" font-size="12.5" fill="#cf222e" text-anchor="start">人に偏りうる</text><rect x="8" y="180.7" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="195.7" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="215.3" font-size="12" fill="#4b5059" text-anchor="start">決まっているが、ふつうは分からない</text><text x="28" y="234.7" font-size="13" fill="#1b1d21" text-anchor="start">・全従業員の本当の平均残業時間</text><rect x="8" y="252.5" width="5" height="18" rx="2" fill="#c2410c"/><text x="20" y="267.5" font-size="13.5" fill="#c2410c" text-anchor="start" font-weight="bold">統計量（標本から計算した値）</text><text x="20" y="287.1" font-size="12" fill="#4b5059" text-anchor="start">標本を取り直すと変わる</text><text x="28" y="306.5" font-size="13" fill="#1b1d21" text-anchor="start">・20人の平均残業時間</text></svg>