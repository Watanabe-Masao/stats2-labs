<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" width="360" height="362" font-family="sans-serif"><rect width="360" height="362" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="183" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="73.14999999999999" width="308" height="105" rx="10" fill="#fbf1e3" stroke="#b86e00" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：全100店舗</text><text x="22" y="50.3" font-size="13" fill="#48504f" text-anchor="start">N＝100</text><text x="38" y="95.1" font-size="14" fill="#b86e00" text-anchor="start" font-weight="bold">標本：協力してくれた10店舗</text><text x="38" y="115.4" font-size="13" fill="#48504f" text-anchor="start">n＝10</text><text x="38" y="136.3" font-size="12.5" fill="#c53b3b" text-anchor="start">⚠ 自分から手を挙げた店。廃棄の少ない店ほど協</text><text x="38" y="154.4" font-size="12.5" fill="#c53b3b" text-anchor="start">力しやすければ、低めに偏る</text><rect x="8" y="199.5" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="214.5" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="234.1" font-size="12" fill="#48504f" text-anchor="start">決まっているが、ふつうは分からない</text><text x="28" y="253.5" font-size="13" fill="#161a1a" text-anchor="start">・全100店の本当の平均廃棄率 μ（分からない）</text><rect x="8" y="271.4" width="5" height="18" rx="2" fill="#b86e00"/><text x="20" y="286.4" font-size="13.5" fill="#b86e00" text-anchor="start" font-weight="bold">統計量（標本から計算した値）</text><text x="20" y="305.9" font-size="12" fill="#48504f" text-anchor="start">標本を取り直すと変わる</text><text x="28" y="325.3" font-size="13" fill="#161a1a" text-anchor="start">・10店の平均 x̄＝2.4%</text></svg>