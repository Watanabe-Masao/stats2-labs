<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 305" width="360" height="305" font-family="sans-serif"><rect width="360" height="305" rx="10" fill="#ffffff"/><rect x="8" y="8" width="344" height="125" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="26" y="54.3" width="308" height="67" rx="10" fill="#fdf0e9" stroke="#c2410c" stroke-width="1.5"/><text x="22" y="30" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：その県の全世帯</text><text x="38" y="76.3" font-size="14" fill="#c2410c" text-anchor="start" font-weight="bold">標本：調べた500世帯</text><text x="38" y="96.6" font-size="13" fill="#4b5059" text-anchor="start">n＝500</text><rect x="8" y="142.4" width="5" height="18" rx="2" fill="#2a78d6"/><text x="20" y="157.4" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="bold">母数（母集団の値）</text><text x="20" y="177" font-size="12" fill="#4b5059" text-anchor="start">決まっているが、ふつうは分からない</text><text x="28" y="196.4" font-size="13" fill="#1b1d21" text-anchor="start">・県の全世帯の本当の平均食費</text><rect x="8" y="214.3" width="5" height="18" rx="2" fill="#c2410c"/><text x="20" y="229.3" font-size="13.5" fill="#c2410c" text-anchor="start" font-weight="bold">統計量（標本から計算した値）</text><text x="20" y="248.8" font-size="12" fill="#4b5059" text-anchor="start">標本を取り直すと変わる</text><text x="28" y="268.2" font-size="13" fill="#1b1d21" text-anchor="start">・500世帯の平均食費</text></svg>