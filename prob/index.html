<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>確率ラボ</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#5d6670;--line:#d0d7de;--card:#f6f8fa;--acc:#0b63c9;--acc2:#b0306f;--ok:#1a7f37;--ng:#cf222e;--task:#fff8e6;--taskline:#e3c26b}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e6edf3;--mut:#a3adb8;--line:#3d444d;--card:#252525;--acc:#4c9bff;--acc2:#e06aa8;--ok:#3fb950;--ng:#f85149;--task:#2b2617;--taskline:#7a6526}}
*{box-sizing:border-box}
body{margin:0;padding:12px 14px 20px;font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%}
h1{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 10px}
.tabs button{flex:1 1 30%;min-height:40px;padding:6px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs button:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
label{font-size:14px;display:flex;align-items:center;gap:6px}
select{font-size:15px;min-height:40px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.big{font-size:18px;font-weight:700}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
button.act,button.sub{min-height:44px;padding:8px 14px;border-radius:10px;font-size:15px;cursor:pointer}
button.act{border:1px solid var(--acc);background:var(--acc);color:#fff}
button.sub{border:1px solid var(--line);background:var(--card);color:var(--fg)}
button:disabled{opacity:.45}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right;vertical-align:top}
td:first-child,th:first-child{text-align:left}
svg{max-width:100%;height:auto;display:block}
/* −／＋ 付きスライダー */
.lk-step{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.lk-step .lk-name{font-size:14px;min-width:4.5em}
.lk-step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;line-height:1;cursor:pointer;flex:none}
.lk-step input[type=range]{flex:1 1 90px;min-width:90px;height:32px}
.lk-step .lk-val{font-weight:700;min-width:4.2em;text-align:right}
/* 課題カード */
.lk-task{background:var(--task);border:1px solid var(--taskline);border-radius:12px;padding:10px 12px;margin:6px 0 4px}
.lk-task .lk-tt{font-weight:700;margin-bottom:2px}
.lk-task input[type=number]{font-size:17px;width:7.5em;min-height:44px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.lk-choices{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.lk-choices button{min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;cursor:pointer}
.lk-choices button.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.lk-skip{background:none;border:none;color:var(--mut);text-decoration:underline;font-size:13px;cursor:pointer;min-height:44px}
.lk-verdict{margin-top:6px;padding-top:6px;border-top:1px dashed var(--taskline)}
/* 予想する前は結果を隠す */
.lk-locked .res{display:none}
.lk-locked .ctl{pointer-events:none;opacity:.5}
.lk-wait{display:none}
.lk-locked .lk-wait{display:block}
/* 式で計算 */
.lk-formula{border-left:3px solid var(--acc);padding:4px 10px;margin:8px 0;font-size:14px}
.lk-formula .lk-ft{font-size:12px;color:var(--mut)}
.lk-formula div.l{font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
/* スマホの操作感：タップで拡大しない・ダブルタップの遅れをなくす・スライダーのつまみを大きく */
button,a,input,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select{font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:40px;margin:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:var(--acc);border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.lk-step{display:grid;grid-template-columns:auto 40px minmax(60px,1fr) 40px auto;gap:6px;align-items:center;flex-wrap:nowrap}
.lk-step .lk-name{min-width:0;font-size:13px;line-height:1.25;max-width:4.5em}
.lk-step button{width:40px;height:40px}
.lk-step input[type=range]{min-width:0;width:100%;height:40px}
.lk-step .lk-val{min-width:3.4em;font-size:14px}
.lk-fixed{font-size:14px}
.lk-why{margin-top:4px;font-size:14px}
.lk-live{margin-top:6px;padding:4px 8px;border-radius:8px;background:var(--bg);font-size:14px}
.lk-bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.lk-link{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--acc);font-size:14px;text-decoration:none;cursor:pointer}
/* Notion の埋め込み（高さ約320px）：要点と操作だけ */
body.lk-embed{padding:8px 12px 10px}
.lk-embed h1{display:none}
.lk-embed .lk-task{margin-top:0}
.lk-embed .lk-tt,.lk-embed .lk-note{display:none}
.lk-embed .lk-q::before{content:"🎯 "}
.lk-embed.lk-locked .ctl{display:none}
.lk-embed.lk-locked .lk-wait{display:none}
.lk-embed.lk-focus .mode>p.mut{display:none}
.lk-embed.lk-pred:not(.lk-more) .mode .res,.lk-embed.lk-pred:not(.lk-more) .mode .det{display:none}
[hidden]{display:none!important}
.lk-step .lk-name{max-width:5.2em;white-space:nowrap}
.lk-embed .lk-done .lk-q{display:none}
.lk-embed .lk-done .lk-verdict{border-top:0;margin-top:0;padding-top:0}
.lk-embed.lk-pred:not(.lk-more) .mode .res.key{display:block}
body.lk-embed.lk-locked.lk-pred .mode .res.key{display:none}
.die{display:flex;gap:6px;justify-content:center;margin:8px 0}
.die div{width:46px;height:46px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:var(--card);position:relative}
.die .a{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,var(--card))}
.die .b{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 22%,var(--card))}
.die .ab{border-color:var(--fg);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--acc) 35%,var(--card)) 0 6px,color-mix(in srgb,var(--acc2) 35%,var(--card)) 6px 12px)}
.legend span{margin-right:10px;font-size:12px;white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
</style></head><body>

<input type="range" id="rab" min="0" max="100" step="1" value="20" data-name="P(A∩B)" data-unit="%">
<div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
<div class="res key" id="rplot"></div>
<div class="card res key" id="rsum"></div>
</div>
<div id="m-atleast" class="mode">
<p class="mut" style="margin:0">1回で起きる確率 p の試行を n 回くり返す（毎回の結果は互いに影響しない）。「少なくとも1回」は 1−(1回も起きない確率)。</p>
<input type="range" id="ta" min="1" max="9" step="1" value="1" data-name="p の分子">
<input type="range" id="tb" min="2" max="10" step="1" value="6" data-name="p の分母">
<input type="range" id="tn" min="1" max="10" step="1" value="2" data-name="回数 n">
<div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
<div class="res key" id="tplot"></div>
<div class="card res key" id="tsum"></div>
</div>

input._lkUpd=upd;upd();return wrap;}
function setRange(id,v){const e=$(id);e.value=v;e._lkUpd&&e._lkUpd();}
function formula(lines,title){return `<div class="lk-formula res"><div class="lk-ft">${esc(title||"式で計算")}</div>${lines.map(l=>`<div class="l">${esc(l)}</div>`).join("")}</div>`;}
function fixPicks(){if(!cfg.predict||!cfg.set)return;
Object.keys(cfg.set).filter(k=>!(cfg.unlock||[]).includes(k)).forEach(k=>{const el=document.querySelector(`#m-${cur} select[data-key="${k}"]`);if(!el)return;
const lab=el.closest("label"),name=lab?lab.firstChild.textContent.trim():"";
const t=document.createElement("span");t.className="lk-fixed";t.innerHTML=`${esc(name)}：<b>${esc(el.options[el.selectedIndex].text)}</b>`;
el.style.display="none";(lab||el).after(t);if(lab)lab.style.display="none";});}
const web=/^https?:$/.test(location.protocol);
function bar(){const b=$("lk-bar");if(!b)return;let h="";
if(EMBED&&FOCUS&&cfg.predict)h+=`<button type="button" class="lk-link" id="lk-more" aria-expanded="false">くわしく（表・式）▾</button>`;
if(EMBED&&web)h+=`<a class="lk-link" href="${esc(location.href.replace(/[?&]embed=1\b/,""))}" target="_blank" rel="noopener">大きく開く ↗</a>`;
if(FOCUS&&web&&window.__LABPRESETS__)h+=`<a class="lk-link" href="./" target="_blank" rel="noopener">ほかのモードも試す ↗</a>`;
b.innerHTML=h;b.hidden=!h;const m=$("lk-more");
if(m)m.onclick=()=>{const on=!document.body.classList.contains("lk-more");document.body.classList.toggle("lk-more",on);m.setAttribute("aria-expanded",on);m.textContent=on?"たたむ ▴":"くわしく（表・式）▾";};}
function taskCard(){const box=$("lk-task");if(!cfg.task){box.remove();return;}
const p=cfg.predict;let h=`<div class="lk-task"><div class="lk-tt">🎯 課題</div><div class="lk-q">${esc(cfg.task)}</div>`;
if(p){h+=`<div id="lk-ask"><div class="mut lk-note">先に予想を決める。決めるまで結果は隠れている。</div>`;
if(p.type==="number")h+=`<div class="row"><label>${esc(p.label||"予想")} <input type="number" id="lk-in" inputmode="decimal" step="any">${esc(p.unit||"")}</label></div>`;
else h+=`<div class="mut">${esc(p.label||"予想")}</div><div class="lk-choices" id="lk-ch">${p.options.map(o=>`<button type="button" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
h+=`<div class="row"><button class="act" id="lk-go" disabled>予想を決めて確かめる</button><button class="lk-skip" id="lk-skip">予想せずに見る</button></div></div>`;}
h+=`<div id="lk-verdict"></div></div>`;box.innerHTML=h;
if(!p)return;
let guess=null;const go=$("lk-go");
if(p.type==="number")$("lk-in").addEventListener("input",e=>{guess=e.target.value===""?null:+e.target.value;go.disabled=guess===null||isNaN(guess);});
else $("lk-ch").querySelectorAll("button").forEach(b=>b.onclick=()=>{guess=b.dataset.v;$("lk-ch").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));go.disabled=false;});
go.onclick=()=>reveal(guess);$("lk-skip").onclick=()=>reveal(null);}
function lock(on){locked=on;document.body.classList.toggle("lk-locked",on);
document.querySelectorAll("#tabs button").forEach(b=>b.disabled=on&&b.dataset.m!==cur);}
function live(){const el=$("lk-live");if(!el||!revealed||!moved)return;el.hidden=false;const p=cfg.predict,r=modes[cur].value(p.key);
el.innerHTML=`動かすと変わる → ${esc(p.label||"結果")}：<b>${esc(r.text)}</b>`;}
function reveal(guess){const p=cfg.predict;lock(false);revealed=true;if(modes[cur].render)modes[cur].render();
const r=modes[cur].value(p.key);last=r;let h="";
const both=`予想 <b>${esc(p.type==="number"?fmtNum(guess)+(p.unit||""):guess)}</b> ／ ラボ <b>${esc(r.text)}</b>`;
if(guess===null)h=`<div>ラボの結果：<b>${esc(r.text)}</b></div>`;
else if(p.type==="number"){const tol=p.tol??Math.max(Math.abs(r.v)*0.01,0.005);const d=guess-r.v,hit=Math.abs(d)<=tol;
h=hit?`<div><span class="ok">◎ 予想どおり</span>　${both}</div>`:
`<div><span class="ng">✕ ずれ ${d>0?"+":""}${esc(fmtNum(d))}${esc(p.unit||"")}</span>　${both}</div><div class="mut">外れた所が学びどころ。</div>`;}
else{const hit=guess===r.text;h=hit?`<div><span class="ok">◎ 予想どおり</span>　${both}</div>`:
`<div><span class="ng">✕ 予想と違った</span>　${both}</div><div class="mut">なぜかを1文で書く。</div>`;}
if(cfg.why)h+=`<div class="lk-why">${esc(cfg.why)}</div>`;
h+=`<div class="lk-live" id="lk-live" hidden></div>`;
$("lk-verdict").innerHTML=`<div class="lk-verdict">${h}</div>`;
const ask=$("lk-ask");if(ask)ask.remove();document.querySelector(".lk-task").classList.add("lk-done");
live();bar();if(EMBED)window.scrollTo(0,0);}
function start(def){const tabs=$("tabs");
const m=cfg.mode&&modes[cfg.mode]?cfg.mode:def;
const shown=(cfg.modes||(cfg.mode?[cfg.mode]:order)).filter(k=>modes[k]);
shown.forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=modes[k].name;b.dataset.m=k;b.onclick=()=>{if(!b.disabled)show(k);};tabs.appendChild(b);});
if(shown.length<2)tabs.hidden=true;
document.body.classList.toggle("lk-embed",EMBED);document.body.classList.toggle("lk-focus",FOCUS);document.body.classList.toggle("lk-pred",!!(FOCUS&&cfg.predict));
if(!$("lk-bar")){const b=document.createElement("div");b.id="lk-bar";b.className="lk-bar";document.body.appendChild(b);}
order.forEach(k=>modes[k].init&&modes[k].init());
if(cfg.set&&modes[m].apply)modes[m].apply(cfg.set);
show(m);fixPicks();taskCard();if(cfg.predict)lock(true);
if(!cfg.predict){const t=$("lk-task");if(t&&EMBED)t.after($("lk-bar"));bar();}else $("lk-bar").hidden=true;
["input","change","click"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest(".mode"))moved=true;setTimeout(live,0);}));}
return {cfg,$,esc,register,show,start,stepper,setRange,formula,fmtNum,embed:EMBED,focus:FOCUS,get last(){return last;},get locked(){return locked;},value:k=>modes[cur].value(k),get mode(){return cur;}};
})();
const $=LK.$,esc=LK.esc;
const W=340;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const frac=(a,b)=>{if(a===0)return "0";const g=gcd(a,b);return b/g===1?String(a/g):`${a/g}/${b/g}`;};
const d3=v=>String(+v.toFixed(3)),pc=v=>String(+(v*100).toFixed(1))+"%";
const EV={even:["偶数",[2,4,6]],odd:["奇数",[1,3,5]],ge4:["4以上",[4,5,6]],le3:["3以下",[1,2,3]],le2:["2以下",[1,2]],m3:["3の倍数",[3,6]],six:["6の目",[6]],one:["1の目",[1]],ge5:["5以上",[5,6]]};
function dVals(){const A=EV[$("da").value][1],B=EV[$("db").value][1],inter=A.filter(x=>B.includes(x)),uni=[...new Set([...A,...B])].sort();
return {A,B,inter,uni,pa:A.length/6,pb:B.length/6,inter_p:inter.length/6,union:uni.length/6,none:1-uni.length/6,excl:inter.length===0?"はい":"いいえ"};}
function dRender(){const D=dVals();
$("dplot").innerHTML=`<div class="die">${[1,2,3,4,5,6].map(k=>{const a=D.A.includes(k),b=D.B.includes(k);return `<div class="${a&&b?"ab":a?"a":b?"b":""}">${k}</div>`;}).join("")}</div><div class="legend mut"><span><i class="sw" style="background:var(--acc)"></i>A だけ</span><span><i class="sw" style="background:var(--acc2)"></i>B だけ</span><span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--acc) 0 3px,var(--acc2) 3px 6px)"></i>両方（重なり）</span></div>`;
$("dsum").innerHTML=`<div>A＝{${D.A.join(",")}}、B＝{${D.B.join(",")}}、重なり A∩B＝{${D.inter.join(",")||"なし"}}</div><div>P(A∪B)＝${D.A.length}/6＋${D.B.length}/6−${D.inter.length}/6＝<b>${frac(D.uni.length,6)}</b>（≒${d3(D.union)}）</div><div class="mut">${D.inter.length?`重なり ${D.inter.length} 個を2回数えた分を1回引く。`:"重なりがない（排反）ので、そのまま足せる。"} どちらも起きない確率＝1−${frac(D.uni.length,6)}＝${frac(6-D.uni.length,6)}。</div>`;}
LK.register("dice",{name:"サイコロで A・B",
init(){const opts=Object.entries(EV).map(([k,[n,s]])=>`<option value="${k}">${n} {${s.join(",")}}</option>`).join("");$("da").innerHTML=opts;$("db").innerHTML=opts;$("da").value="even";$("db").value="ge4";$("da").onchange=dRender;$("db").onchange=dRender;dRender();},
apply(s){if(s.a)$("da").value=s.a;if(s.b)$("db").value=s.b;dRender();},
render:dRender,
value(key){const D=dVals(),v={union:D.union,inter:D.inter_p,pa:D.pa,pb:D.pb,none:D.none,excl:D.excl}[key];return key==="excl"?{v,text:v}:{v,text:d3(v)};}});
function rVals(){let a=+$("ra").value,b=+$("rb").value,ab=+$("rab").value;const lo=Math.max(0,a+b-100),hi=Math.min(a,b);ab=Math.min(hi,Math.max(lo,ab));
const uni=a+b-ab;return {a,b,ab,lo,hi,union:uni,none:100-uni,aonly:a-ab,bonly:b-ab,one:a+b-2*ab,excl:ab===0?"はい":"いいえ"};}
function rRender(){const R=rVals();if(+$("rab").value!==R.ab)LK.setRange("rab",R.ab);
const x=v=>10+v/100*(W-20),H=96;
let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="確率を面積で表した帯">`;
const seg=[[0,R.aonly,"var(--acc)","Aだけ"],[R.aonly,R.ab,"url(#hatch)","両方"],[R.a,R.bonly,"var(--acc2)","Bだけ"],[R.union,R.none,"var(--card)","どちらも×"]];
s+=`<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="var(--acc)"/><rect x="4" width="4" height="8" fill="var(--acc2)"/></pattern></defs>`;
seg.forEach(([st,w,c,t])=>{if(w<=0)return;s+=`<rect x="${x(st)}" y="14" width="${x(st+w)-x(st)}" height="34" fill="${c}" fill-opacity="${c.startsWith("var(--card")?1:.55}" stroke="var(--line)"/>`;if(w>=9)s+=`<text x="${(x(st)+x(st+w))/2}" y="35" font-size="11" text-anchor="middle" fill="var(--fg)" font-weight="700">${w}%</text>`;});
s+=`<line x1="${x(0)}" y1="56" x2="${x(R.a)}" y2="56" stroke="var(--acc)" stroke-width="3"/><text x="${x(0)}" y="70" font-size="11" fill="var(--fg)">A ${R.a}%</text>`;
s+=`<line x1="${x(R.aonly)}" y1="78" x2="${x(R.aonly+R.b)}" y2="78" stroke="var(--acc2)" stroke-width="3"/><text x="${x(R.aonly)}" y="92" font-size="11" fill="var(--fg)">B ${R.b}%</text></svg>`;
$("rplot").innerHTML=s+`<div class="legend mut"><span><i class="sw" style="background:var(--acc)"></i>Aだけ</span><span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--acc) 0 3px,var(--acc2) 3px 6px)"></i>両方</span><span><i class="sw" style="background:var(--acc2)"></i>Bだけ</span></div>`;
$("rsum").innerHTML=`<div>P(A∪B)＝${R.a}＋${R.b}−${R.ab}＝<b>${R.union}%</b>　どちらも起きない＝100−${R.union}＝<b>${R.none}%</b></div><div class="mut">P(A∩B) が取れる範囲は ${R.lo}〜${R.hi}%（両方の部分は A にも B にも入るので、どちらよりも大きくなれない。全体は100%を超えない）。${R.ab===0?"重なり0＝排反。":""}</div>`;}
LK.register("area",{name:"確率を面積で",
init(){["ra","rb","rab"].forEach(id=>LK.stepper($(id),rRender));rRender();},
apply(s){if(s.a!==undefined)LK.setRange("ra",s.a);if(s.b!==undefined)LK.setRange("rb",s.b);if(s.ab!==undefined)LK.setRange("rab",s.ab);rRender();},
render:rRender,
value(key){const R=rVals(),v=R[key];return key==="excl"?{v,text:v}:{v,text:v+"%"};}});
function tVals(){let a=+$("ta").value,b=+$("tb").value;if(a>=b)a=b-1;const n=+$("tn").value,p=a/b,none=Math.pow(1-p,n);return {a,b,n,p,none,atleast:1-none,naive:n*p};}
function tRender(){const T=tVals();if(+$("ta").value!==T.a)LK.setRange("ta",T.a);
const H=150,X=k=>34+(k-0.5)*(W-44)/T.n,Y=v=>H-22-Math.min(v,1.2)/1.2*(H-36),bw=Math.min(26,(W-44)/T.n*0.6);
let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="回数と少なくとも1回の確率"><line x1="30" y1="${Y(0)}" x2="${W-8}" y2="${Y(0)}" stroke="var(--line)"/><line x1="30" y1="${Y(1)}" x2="${W-8}" y2="${Y(1)}" stroke="var(--mut)" stroke-dasharray="4 4"/><text x="26" y="${Y(1)+4}" font-size="10" text-anchor="end" fill="var(--mut)">1</text><text x="26" y="${Y(0)+4}" font-size="10" text-anchor="end" fill="var(--mut)">0</text>`;
for(let k=1;k<=T.n;k++){const v=1-Math.pow(1-T.p,k),nv=k*T.p;s+=`<rect x="${X(k)-bw/2}" y="${Y(v)}" width="${bw}" height="${Y(0)-Y(v)}" rx="3" fill="var(--acc)" fill-opacity="${k===T.n?.85:.45}"/><circle cx="${X(k)}" cy="${Y(nv)}" r="3.5" fill="none" stroke="var(--acc2)" stroke-width="2"/><text x="${X(k)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${k}</text>`;}
s+=`</svg>`;
$("tplot").innerHTML=s+`<div class="legend mut"><span><i class="sw" style="background:var(--acc)"></i>少なくとも1回（正しい）</span><span><i class="sw" style="border:2px solid var(--acc2)"></i>p×回数（誤り）</span></div>`;
const bn=T.b-T.a,num=Math.pow(T.b,T.n)-Math.pow(bn,T.n),den=Math.pow(T.b,T.n);
$("tsum").innerHTML=`<div>1回も起きない＝(${T.b-T.a}/${T.b})^${T.n}＝${frac(Math.pow(bn,T.n),den)}　→　少なくとも1回＝1−${frac(Math.pow(bn,T.n),den)}＝<b>${frac(num,den)}</b>（≒${d3(T.atleast)}）</div><div class="mut">${T.a}/${T.b}×${T.n}＝${d3(T.naive)} とすると、2回以上起きる場合を何度も数えてしまう${T.naive>1?"（1を超えて確率にならない）":""}。</div>`;}
LK.register("atleast",{name:"少なくとも1回",
init(){["ta","tb","tn"].forEach(id=>LK.stepper($(id),tRender));tRender();},
apply(s){if(s.b!==undefined)LK.setRange("tb",s.b);if(s.a!==undefined)LK.setRange("ta",s.a);if(s.n!==undefined)LK.setRange("tn",s.n);tRender();},
render:tRender,
value(key){const T=tVals(),v=T[key];return {v,text:d3(v)};}});
LK.start("dice");
window.__LAB__={LK,dVals,rVals,tVals};
</script>
